name: Android APK

on:
  push:
    branches: [ccr-af813d21-xqanha, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Create Android project
        run: |
          npm run www
          npx cap add android

      - name: App icon (cat)
        continue-on-error: true
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#FBF8F4' --iconBackgroundColorDark '#24222A'
          --splashBackgroundColor '#FBF8F4' --splashBackgroundColorDark '#24222A'

      - name: Sync web app and plugins
        run: npx cap sync android

      - name: Version number and fixed signing key
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          # Same debug key on every build, so a new APK installs over the old one (progress is kept)
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Japantalk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Japantalk-apk
          path: Japantalk.apk

      - name: Publish as release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Japantalk 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Japantalk.apk
          body: |
            Download **Japantalk.apk** on your Android phone and open it to install.

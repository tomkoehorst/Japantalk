name: Android APK

on:
  push:
    branches: [ccr-af813d21-xqanha, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          PW: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Secrets SIGNING_KEYSTORE_B64 en SIGNING_PASSWORD ontbreken (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check lesson content (readings, romaji, duplicates)
        run: node tools/check-content.js

      - name: Restore recorded voices (cache)
        uses: actions/cache@v4
        with:
          path: audio
          key: audio-${{ hashFiles('index.html', 'tools/make-audio.js') }}
          restore-keys: audio-

      - name: Record natural voices (Google Cloud TTS, only new texts)
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: node tools/make-audio.js

      - name: Create Android project
        run: |
          npm run www
          # app knows its own build number (used by the in-app updater)
          sed -i 's/__BUILD__/${{ github.run_number }}/' www/index.html
          npx cap add android
          # own native code: MainActivity + ApkVerifier plugin (checks update signatures)
          cp native/app/japantalk/*.java android/app/src/main/java/app/japantalk/
          # allow the app to install its own updates
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml

      - name: App icon (cat)
        continue-on-error: true
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#FBF8F4' --iconBackgroundColorDark '#24222A'
          --splashBackgroundColor '#FBF8F4' --splashBackgroundColorDark '#24222A'

      - name: Sync web app and plugins
        run: npx cap sync android

      - name: Version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK with your own key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-pass env:SIGNING_PASSWORD --ks-key-alias japantalk \
            --out Japantalk.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.p12"
          "$BT/apksigner" verify --print-certs Japantalk.apk | tee certs.txt
          echo "CERT_SHA256=$(grep -m1 'SHA-256' certs.txt | awk '{print $NF}')" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Japantalk-apk
          path: Japantalk.apk

      - name: Publish as release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Japantalk 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Japantalk.apk
          body: |
            Download **Japantalk.apk** op je Android-telefoon en open het bestand om te installeren.
            Heb je de app al? Dan meldt hij deze update vanzelf.

            Sleutel (SHA-256): `${{ env.CERT_SHA256 }}`

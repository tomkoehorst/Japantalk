<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japantalk – Japans leren praten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F4; --card:#FFFFFF; --text:#3D3A44; --muted:#8A8594; --line:#ECE6DF;
  --sage:#B8D8C8; --lav:#CFC6EA; --peach:#F6D2BE; --blue:#C4DCEF; --butter:#F4E6B0;
  --good:#A9D8B8; --good-ink:#3F7A57; --bad:#E9A9A0; --bad-ink:#9A4A40;
  --shadow:0 4px 18px rgba(61,58,68,.08); --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not(.light){
  --bg:#24222A; --card:#2F2C36; --text:#ECE8F2; --muted:#A39DAF; --line:#3B3843;
  --sage:#8FB3A2; --lav:#A59CC4; --peach:#CDA894; --blue:#9CB6CB; --butter:#C9BC8C;
  --good:#7FAE8E; --good-ink:#D6F0DE; --bad:#C28880; --bad-ink:#FBE0DB;
  --shadow:0 4px 18px rgba(0,0,0,.3);
}}
:root.dark{
  --bg:#24222A; --card:#2F2C36; --text:#ECE8F2; --muted:#A39DAF; --line:#3B3843;
  --sage:#8FB3A2; --lav:#A59CC4; --peach:#CDA894; --blue:#9CB6CB; --butter:#C9BC8C;
  --good:#7FAE8E; --good-ink:#D6F0DE; --bad:#C28880; --bad-ink:#FBE0DB;
  --shadow:0 4px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 18px 10px}
.brand{font-weight:800;font-size:1.3rem;flex:1;display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--shadow);padding:6px 12px;border-radius:999px;font-weight:700;font-size:.95rem}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-size:1.1rem}

/* home */
.goalcard{margin:6px 18px 8px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;gap:14px;align-items:center}
.goalcard .info{flex:1}
.goalcard h3{margin:0 0 4px;font-size:1.05rem}
.goalcard p{margin:0;color:var(--muted);font-size:.9rem}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:999px;transition:width .4s}
.practice-btn{margin:4px 18px 4px;display:flex;align-items:center;gap:12px;background:var(--lav);border-radius:var(--r);padding:12px 16px;font-weight:700;box-shadow:var(--shadow);text-align:left}
.practice-btn small{display:block;font-weight:600;opacity:.75}
.practice-btn[disabled]{opacity:.5;cursor:default}
.unit{margin:22px 18px 6px}
.unit-head{border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);color:#3D3A44}
.unit-head h2{margin:0;font-size:1.1rem}
.unit-head p{margin:2px 0 0;font-size:.9rem;opacity:.8}
.path{display:flex;flex-direction:column;align-items:center;padding:44px 0 4px;gap:14px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:74px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:800;color:#3D3A44;
  box-shadow:0 6px 0 rgba(61,58,68,.15);transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(61,58,68,.15)}
.node.locked{background:var(--line)!important;color:var(--muted);box-shadow:0 6px 0 rgba(61,58,68,.08)}
.node-label{font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:700;text-align:center;max-width:140px}
.start-bubble{position:absolute;top:-40px;background:var(--card);border-radius:12px;padding:5px 12px;font-weight:800;font-size:.85rem;box-shadow:var(--shadow);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.start-bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--card);border-bottom:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.side-cat{position:absolute;top:0}
.footer-note{color:var(--muted);text-align:center;font-size:.85rem;padding:24px 24px 40px}

/* lesson */
.lesson{flex:1;display:flex;flex-direction:column}
.lesson-top{display:flex;align-items:center;gap:14px;padding:16px 18px}
.lesson-top .bar{flex:1;margin:0;height:14px}
.closebtn{font-size:1.5rem;color:var(--muted);width:36px;height:36px}
.ex{flex:1;padding:6px 20px 20px;display:flex;flex-direction:column}
.ex-title{font-size:1.35rem;font-weight:800;margin:6px 0 16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.speaker-row{display:flex;gap:16px;align-items:flex-start}
.bubble{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.bubble:before{content:"";position:absolute;left:-10px;top:24px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.big-jp{font-size:1.7rem;font-weight:700;line-height:1.35}
.romaji{color:var(--muted);font-size:1.05rem;margin-top:2px}
.nl{margin-top:8px;font-weight:700}
.play-row{display:flex;gap:10px;margin-top:12px}
.play{display:inline-flex;align-items:center;gap:6px;background:var(--blue);border-radius:12px;padding:8px 14px;font-weight:700;color:#3D3A44}
.play.slow{background:var(--butter)}
.big-play{width:110px;height:110px;border-radius:28px;background:var(--blue);display:grid;place-items:center;margin:10px auto 6px;font-size:2.6rem;box-shadow:0 6px 0 rgba(61,58,68,.12)}
.big-play:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(61,58,68,.12)}
.options{display:grid;gap:10px;margin-top:16px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-weight:700;font-size:1.05rem;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:12px}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 30%,var(--card));box-shadow:0 3px 0 var(--blue)}
.opt .num{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--muted);flex:none}
.opt .sp{font-size:1.2rem}
.prompt-nl{font-size:1.5rem;font-weight:800;margin:4px 0}
.hint{margin-top:10px;color:var(--muted);font-weight:700;text-decoration:underline dotted;text-underline-offset:4px}
.hint-text{margin-top:10px}
.mic-area{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.mic{width:100%;max-width:420px;padding:18px;border-radius:18px;background:var(--sage);font-weight:800;font-size:1.1rem;color:#3D3A44;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 rgba(61,58,68,.15)}
.mic:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(61,58,68,.15)}
.mic.listening{background:var(--peach);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 rgba(61,58,68,.15),0 0 0 10px color-mix(in srgb,var(--peach) 35%,transparent)}}
.linkbtn{color:var(--muted);font-weight:700;font-size:.9rem;padding:6px}
.heard{color:var(--muted);font-size:.95rem;text-align:center;min-height:1.3em}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:85%;border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.msg.cat{background:var(--card);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:color-mix(in srgb,var(--sage) 55%,var(--card));align-self:flex-end;border-top-right-radius:4px}
.msg .jp{font-weight:700;font-size:1.15rem}
.msg .r{color:var(--muted);font-size:.85rem}
.msg .t{font-size:.85rem;margin-top:2px}
.msg button{font-size:.85rem;margin-top:4px;color:var(--muted);font-weight:700}
.chat-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.actionbar{position:sticky;bottom:0;padding:16px 20px calc(18px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line)}
.actionbar.good{background:color-mix(in srgb,var(--good) 35%,var(--bg));border-color:transparent}
.actionbar.bad{background:color-mix(in srgb,var(--bad) 35%,var(--bg));border-color:transparent}
.fb{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.fb h4{margin:0;font-size:1.2rem}
.good .fb h4{color:var(--good-ink)}
.bad .fb h4{color:var(--bad-ink)}
.fb p{margin:2px 0 0;font-size:.95rem}
.btnrow{display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:16px;font-weight:800;font-size:1.05rem;background:var(--sage);color:#3D3A44;box-shadow:0 4px 0 rgba(61,58,68,.15)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(61,58,68,.15)}
.btn.secondary{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.coral{background:var(--bad)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:default;transform:none}

/* result */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;gap:10px}
.result h1{margin:8px 0 0;font-size:1.8rem}
.stats{display:flex;gap:12px;margin:14px 0 24px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 18px;min-width:96px}
.stat b{display:block;font-size:1.4rem}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}

/* settings */
.page{padding:6px 18px 40px}
.setting{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.setting h3{margin:0 0 4px;font-size:1rem}
.setting p{margin:0 0 10px;color:var(--muted);font-size:.9rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:8px 14px;border-radius:12px;border:2px solid var(--line);font-weight:700}
.seg button.on{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 40%,var(--card))}
.warn{background:color-mix(in srgb,var(--butter) 50%,var(--card));border-radius:var(--r);padding:12px 14px;margin:8px 18px;font-size:.9rem;display:flex;gap:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;font-size:.9rem;max-width:90vw}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>

const STORE = "japantalk-v1";
const today = () => new Date().toISOString().slice(0,10);
const defaults = () => ({ xp:0, daily:{date:today(),xp:0}, streak:{count:0,last:null}, goal:20,
  done:{}, ph:{}, settings:{rate:0.9, romaji:true, kana:true, mode:"auto", theme:"auto"} });
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s){ const d=defaults(); return {...d,...s,settings:{...d.settings,...s.settings}}; } }catch(e){}
  return defaults();
}
function save(){ localStorage.setItem(STORE, JSON.stringify(S)); }
function rollDay(){
  if(S.daily.date!==today()) S.daily={date:today(),xp:0};
  // streak broken?
  if(S.streak.last){
    const diff = Math.round((new Date(today()) - new Date(S.streak.last))/864e5);
    if(diff>1) S.streak.count=0;
  }
}
function addXP(n){
  rollDay();
  S.xp+=n; S.daily.xp+=n;
  if(S.streak.last!==today()){ S.streak.count+=1; S.streak.last=today(); }
  save();
}
function mark(p, ok){
  if(!p.key) return;
  const r = S.ph[p.key] || {s:0,n:0};
  r.n++; r.s = Math.max(0, Math.min(5, r.s + (ok?1:-2))); r.t=Date.now();
  S.ph[p.key]=r;
}
function applyTheme(){
  const t=S.settings.theme, el=document.documentElement;
  el.classList.toggle("dark", t==="dark"); el.classList.toggle("light", t==="light");
}

let jaVoice=null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  jaVoice = vs.find(v=>/google/i.test(v.name)) || vs.find(v=>/kyoko|o-ren|haruka|nanami/i.test(v.name)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = ()=>{ pickVoice(); if(view==="home") render(); }; }
function speak(text, mult=1){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[～〜]/g,""));
    u.lang="ja-JP"; if(jaVoice) u.voice=jaVoice;
    u.rate = Math.max(0.4, Math.min(1.6, S.settings.rate*mult));
    u.onend=res; u.onerror=res;
    speechSynthesis.speak(u);
  });
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canRecognize = () => !!SR && S.settings.mode==="auto";
let rec=null;
function listen(){
  return new Promise((resolve,reject)=>{
    speechSynthesis && speechSynthesis.cancel();
    rec = new SR(); rec.lang="ja-JP"; rec.interimResults=false; rec.maxAlternatives=5; rec.continuous=false;
    let got=null;
    rec.onresult = e => { got = Array.from(e.results[0]).map(a=>a.transcript); };
    rec.onerror = e => { if(e.error==="no-speech"||e.error==="aborted") return; reject(e.error); };
    rec.onend = () => { rec=null; resolve(got||[]); };
    try{ rec.start(); }catch(e){ reject("start"); }
  });
}
function stopListening(){ if(rec) try{rec.stop()}catch(e){} }

// --- matching ---
function toHira(s){ return s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function norm(s){
  return toHira(s.normalize("NFKC").toLowerCase())
    .replace(/[\s、。，,．.！!？?・「」『』"'~〜～…]/g,"");
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[n];
}
function score(heard, p){
  const targets=[p.ja,p.kana,...(p.alt||[])].map(norm);
  let best=0;
  for(const h of heard){ const hn=norm(h); if(!hn) continue;
    for(const t of targets){
      let sc = 1 - lev(hn,t)/Math.max(hn.length,t.length);
      if(t.length>=4 && hn.includes(t)) sc=Math.max(sc,0.95);   // said extra words around it
      best=Math.max(best,sc);
    }}
  return best;
}

// --- soft sounds ---
let actx=null;
function chime(good){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = good? [660,880] : [330,262];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t=actx.currentTime+i*0.11;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.4);
    });
  }catch(e){}
}

/* =========================================================
   LESSON BUILDING
   ========================================================= */
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
function learnedPhrases(){ return Object.keys(S.ph).map(k=>{const [u,p]=k.split(".");return UNITS[u]?.phrases[p];}).filter(Boolean); }
function distractors(p, n){
  let pool = UNITS[p.unit].phrases.filter(x=>x!==p && x.nl!==p.nl);
  if(pool.length<n) pool = pool.concat(Object.values(PHRASES).filter(x=>x.unit!==p.unit));
  return pick(pool, n);
}
function buildLesson(L){
  const ex=[];
  if(L.dialog){
    pick(L.phrases,4).forEach((p,i)=>ex.push({type: i%2? "listen":"speak", p}));
    const lines = UNITS[L.ui].dialog.map(l => l.ref ? {...PHRASES[l.ref], who:"me"} : l);
    lines.forEach((l,i)=>{ if(l.who==="me") ex.push({type:"dialog", lines, idx:i, p:l}); });
    return ex;
  }
  const ps=L.phrases;
  ps.forEach((p,i)=>{
    ex.push({type:"intro",p});
    if(i>0) ex.push({type: Math.random()<.5?"listen":"choose", p:ps[i-1]});
  });
  ex.push({type:"listen", p:ps[ps.length-1]});
  const tail = shuffle(ps).map(p=>({type:"speak",p}));
  pick(ps,2).forEach(p=>tail.push({type:"choose",p}));
  return ex.concat(shuffle(tail));
}
function buildPractice(){
  const all = learnedPhrases();
  const sorted = [...all].sort((a,b)=>(S.ph[a.key].s - S.ph[b.key].s) || (S.ph[a.key].t - S.ph[b.key].t));
  const sel = shuffle(sorted.slice(0, Math.min(8, sorted.length)));
  const ex=[];
  sel.forEach((p,i)=>ex.push({type:["speak","listen","speak","choose"][i%4], p}));
  return ex.concat(shuffle(sel).slice(0,4).map(p=>({type:"speak",p})));
}

  </button>`;
  UNITS.forEach((u,ui)=>{
    html += `<section class="unit"><div class="unit-head" style="background:${u.color}">
      <h2>Unit ${ui+1} · ${esc(u.title)}</h2><p>${esc(u.desc)}</p></div><div class="path">`;
    lessonsOf(ui).forEach((L,li)=>{
      const id=`${ui}.${li}`, done=!!S.done[id], open=isUnlocked(ui,li), isCur=id===current;
      const x = [0,-60,40][li] + (ui%2? 20:-20);
      html += `<div class="node-wrap" style="transform:translateX(${x}px)">
        ${isCur?`<div class="start-bubble">START</div>`:""}
        <button class="node ${open?"":"locked"}" style="background:${u.color}" ${open?`onclick="startLesson(${ui},${li})"`:`onclick="toast('Rond eerst de vorige les af 🐾')"`} aria-label="${esc(L.name)}">
          ${done?"★":open?icons[li]:"🔒"}
        </button>
        ${isCur?`<div class="side-cat" style="left:${x>0?-90:90}px">${cat("curious",64)}</div>`:""}
        <div class="node-label">${esc(L.name)}${done?` · ${"★".repeat(Math.min(3,S.done[id]))}`:""}</div>
      </div>`;
    });
    html += `</div></section>`;
  });
  html += `<div class="footer-note">Geen kistjes, geen edelstenen, geen winkel.<br>Gewoon praten. がんばって！</div>`;
  $app.innerHTML = html;
}

function go(v){ if(view==="home") window._homeScroll=window.scrollY; view=v; render(); }

/* ---------- lesson flow ---------- */
function startLesson(ui,li){
  const L = lessonsOf(ui)[li];
  window._homeScroll=window.scrollY;
  lesson = { L, id:`${ui}.${li}`, queue:buildLesson(L), i:0, total:0, mistakes:0, correct:0, state:"ask", noMic:false, sel:null, heard:"", attempt:0, retried:new Set() };
  lesson.total = lesson.queue.length;
  view="lesson"; render();
}
function startPractice(){
  window._homeScroll=window.scrollY;
  lesson = { L:{name:"Oefenen"}, id:null, queue:buildPractice(), i:0, total:0, mistakes:0, correct:0, state:"ask", noMic:false, sel:null, heard:"", attempt:0, retried:new Set() };
  lesson.total = lesson.queue.length;
  view="lesson"; render();
}
function quitLesson(){
  if(lesson && lesson.i>0 && !confirm("Les stoppen? Je voortgang in deze les gaat verloren.")) return;
  stopListening(); speechSynthesis?.cancel(); lesson=null; view="home"; render();
}
function curEx(){ return lesson.queue[lesson.i]; }
function effType(ex){
  if((ex.type==="speak"||ex.type==="intro") && lesson.noMic) return ex.type==="intro" ? "intro" : "choose";
  return ex.type;
}

function renderEx(){
  const ex=curEx(), t=effType(ex), p=ex.p;
  const prog = Math.round(lesson.i/lesson.total*100);
  let body="";
  if(t==="intro"){
    body = `<div class="ex-title">Nieuwe zin ✨</div>
      <div class="speaker-row">${cat("talking",76)}
        <div class="bubble">${jpBlock(p)}<div class="nl">${esc(p.nl)}</div>
          <div class="play-row"><button class="play" onclick="say()">🔊 Luister</button><button class="play slow" onclick="say(.6)">🐢 Langzaam</button></div>
        </div></div>
      ${lesson.noMic?"":micArea("Zeg het na")}`;
  }
  else if(t==="speak"){
    body = `<div class="ex-title">Zeg dit in het Japans</div>
      <div class="speaker-row">${cat("curious",76)}
        <div class="bubble"><div class="prompt-nl">“${esc(p.nl)}”</div>
          ${lesson.hint?`<div class="hint-text">${jpBlock(p,false)}<div class="play-row"><button class="play" onclick="say()">🔊</button><button class="play slow" onclick="say(.6)">🐢</button></div></div>`
                       :`<button class="hint" onclick="lesson.hint=true;renderEx()">💡 Hint</button>`}
        </div></div>
      ${micArea("Tik en spreek")}`;
  }
  else if(t==="listen"){
    if(!ex.opts) ex.opts = shuffle([p, ...distractors(p,3)]);
    body = `<div class="ex-title">Wat betekent dit?</div>
      <div style="display:flex;gap:12px;justify-content:center;align-items:center">
        <button class="big-play" onclick="say()" aria-label="Luister">🔊</button>
        <button class="play slow" onclick="say(.6)">🐢</button>
      </div>
      <div class="options">${ex.opts.map((o,i)=>`<button class="opt ${lesson.sel===i?"sel":""}" onclick="choose(${i})"><span class="num">${i+1}</span>${esc(o.nl)}</button>`).join("")}</div>`;
  }
  else if(t==="choose"){
    if(!ex.opts) ex.opts = shuffle([p, ...distractors(p,2)]);
    body = `<div class="ex-title">Hoe zeg je…</div>
      <div class="card"><div class="prompt-nl">“${esc(p.nl)}”</div></div>
      <p style="color:var(--muted);margin:14px 0 0;font-weight:600">Tik om te luisteren en te kiezen:</p>
      <div class="options">${ex.opts.map((o,i)=>`<button class="opt ${lesson.sel===i?"sel":""}" onclick="choose(${i},true)"><span class="sp">🔊</span>
        <span>${S.settings.romaji? esc(o.romaji) : `Optie ${i+1}`}</span></button>`).join("")}</div>`;
  }
  else if(t==="dialog"){
    const shown = ex.lines.slice(0, ex.idx);
    body = `<div class="chat-head">${cat("talking",48)}<div><b>Gesprek met Neko</b><div style="color:var(--muted);font-size:.85rem">Jij bent aan de beurt</div></div></div>
      <div class="chat">${shown.map((l,i)=>`<div class="msg ${l.who}">
          <div class="jp">${esc(l.ja)}</div>${S.settings.romaji?`<div class="r">${esc(l.romaji)}</div>`:""}<div class="t">${esc(l.nl)}</div>
          ${l.who==="cat"?`<button onclick="sayLine(${i})">🔊 nog eens</button>`:""}</div>`).join("")}
        <div class="msg me" style="opacity:.9;border:2px dashed var(--sage);background:var(--card)">
          <div style="font-weight:700">Zeg: “${esc(p.nl)}”</div>
          ${lesson.hint?`<div class="hint-text">${jpBlock(p,false)}</div><button onclick="say()">🔊 voorbeeld</button>`:`<button class="hint" onclick="lesson.hint=true;renderEx()">💡 Hint</button>`}
        </div></div>
      ${lesson.noMic? `<div class="mic-area"><button class="mic" onclick="selfJudgeReveal()">🙊 Ik heb het in gedachten gezegd</button></div>` : micArea("Antwoord Neko")}`;
  }

  $app.innerHTML = `<div class="lesson">
    <div class="lesson-top"><button class="closebtn" onclick="quitLesson()" aria-label="Stoppen">✕</button>
      <div class="bar"><i style="width:${prog}%"></i></div></div>
    <div class="ex pop">${body}</div>
    ${actionBar(t)}
  </div>`;
  // auto audio
  if(lesson.state==="ask" && !lesson.autoplayed){
    lesson.autoplayed=true;
    if(t==="intro"||t==="listen") setTimeout(()=>say(),250);
    if(t==="dialog"){ const prev=ex.lines[ex.idx-1]; if(prev&&prev.who==="cat") setTimeout(()=>sayLine(ex.idx-1),250); }
  }
}
function micArea(label){
  const st=lesson.state;
  if(!canRecognize()){
    return `<div class="mic-area">
      ${st==="ask"?`<button class="mic" onclick="selfJudgeReveal()">🗣️ Ik heb het hardop gezegd</button>`:""}
      <button class="linkbtn" onclick="noMic()">Kan nu niet praten</button></div>`;
  }
  return `<div class="mic-area">
    <div class="heard">${lesson.heard?`Ik hoorde: <span class="jp">“${esc(lesson.heard)}”</span>`:""}</div>
    ${st==="ask"||st==="listening"?`<button class="mic ${st==="listening"?"listening":""}" onclick="toggleMic()">🎙️ ${st==="listening"?"Ik luister… (tik om te stoppen)":label}</button>`:""}
    ${st==="ask"?`<button class="linkbtn" onclick="noMic()">Kan nu niet praten</button>`:""}
  </div>`;
}
function actionBar(t){
  const st=lesson.state, ex=curEx();
  if(st==="good"||st==="bad"){
    const good=st==="good";
    const titles = good? ["Heel goed!","Perfect!","すごい！","Top!","Lekker bezig!"] : ["Nog niet helemaal","Bijna!","Oeps!"];
    const title = lesson.fbTitle || (lesson.fbTitle = titles[Math.random()*titles.length|0]);
    const speakish = ["intro","speak","dialog"].includes(t) && canRecognize() && !lesson.selfJudged;
    return `<div class="actionbar ${st} pop">
      <div class="fb">${cat(good?"happy":"worried",56)}<div><h4>${title}</h4>
        ${good? (lesson.fbNote?`<p>${lesson.fbNote}</p>`:"") :
          `<p>Juist antwoord: <b class="jp">${esc(ex.p.ja)}</b>${S.settings.romaji?` · ${esc(ex.p.romaji)}`:""}<br>${esc(ex.p.nl)}</p>`}
        <button class="play" style="margin-top:6px" onclick="say()">🔊 Luister</button></div></div>
      <div class="btnrow">
        ${!good&&speakish?`<button class="btn secondary" onclick="retry()">Opnieuw</button>`:""}
        <button class="btn ${good?"":"coral"}" onclick="next()">Doorgaan</button>
      </div></div>`;
  }
  if(st==="self"){
    return `<div class="actionbar pop">
      <div class="fb">${cat("curious",56)}<div><h4>Klonk het zo?</h4><p class="jp" style="font-weight:700">${esc(ex.p.ja)}</p><p>${esc(ex.p.romaji)}</p>
      <button class="play" style="margin-top:6px" onclick="say()">🔊 Luister</button></div></div>
      <div class="btnrow"><button class="btn coral" onclick="judge(false)">Nog niet</button><button class="btn" onclick="judge(true)">Ja, goed!</button></div></div>`;
  }
  if(t==="listen"||t==="choose"){
    return `<div class="actionbar"><div class="btnrow"><button class="btn" ${lesson.sel==null?"disabled":""} onclick="check()">Controleer</button></div></div>`;
  }
  if(t==="intro" && lesson.noMic){
    return `<div class="actionbar"><div class="btnrow"><button class="btn" onclick="resolve(true)">Doorgaan</button></div></div>`;
  }
  return `<div class="actionbar"><div class="btnrow"><button class="btn secondary" onclick="skip()">Overslaan</button></div></div>`;
}

function say(mult=1){ if(!lesson||view!=="lesson") return; const ex=curEx(); return speak(ex.p.ja, mult); }
function sayLine(i){ if(!lesson||view!=="lesson") return; const l=curEx().lines[i]; speak(l.ja, l.fast?1.35:l.slow?0.65:1); }
function choose(i, play){
  lesson.sel=i; const ex=curEx();
  if(play) speak(ex.opts[i].ja);
  renderEx();
}
function check(){
  const ex=curEx(); const ok = ex.opts[lesson.sel]===ex.p;
  resolve(ok);
}
async function toggleMic(){
  if(lesson.state==="listening"){ stopListening(); return; }
  lesson.state="listening"; lesson.heard=""; renderEx();
  try{
    const heard = await listen();
    if(view!=="lesson"||!lesson) return;
    if(!heard.length){ lesson.state="ask"; lesson.heard="(niets gehoord – probeer het nog eens)"; renderEx(); return; }
    lesson.heard = heard[0];
    const sc = score(heard, curEx().p);
    lesson.fbNote = sc>=.95 ? "Uitspraak klinkt perfect." : sc>=.75 ? "Goed verstaanbaar!" : "";
    resolve(sc>=.75);
  }catch(err){
    lesson.state="ask"; renderEx();
    if(err==="not-allowed"||err==="service-not-allowed"){
      toast("Geen toegang tot de microfoon. Je kunt jezelf beoordelen (zie Instellingen).");
      S.settings.mode="self"; save(); renderEx();
    } else toast("Spraakherkenning lukte niet ("+err+"). Probeer opnieuw.");
  }
}
function selfJudgeReveal(){ lesson.state="self"; lesson.selfJudged=true; renderEx(); say(); }
function judge(ok){ resolve(ok); }
function noMic(){ lesson.noMic=true; stopListening(); lesson.state="ask"; lesson.autoplayed=false; renderEx(); toast("Oké! De rest van deze les zonder praten 🤫"); }
function skip(){ stopListening(); resolve(false, true); }
function retry(){ lesson.state="ask"; lesson.heard=""; lesson.fbTitle=null; renderEx(); }

function resolve(ok, skipped=false){
  const ex=curEx();
  lesson.state = ok ? "good" : "bad";
  lesson.fbTitle=null;
  if(ex.type!=="intro" || !lesson.noMic) chime(ok);
  if(!ex.counted){
    ex.counted=true;
    if(ok) lesson.correct++; else lesson.mistakes++;
    if(ex.p.key) mark(ex.p, ok);
  }
  // wrong answers come back later (once), like Duolingo
  if(!ok && ex.type!=="dialog" && !ex.requeued){
    ex.requeued=true;
    lesson.queue.push({type: ex.type==="intro"?"speak":ex.type, p:ex.p, requeued:true});
    lesson.total++;
  }
  renderEx();
}
function next(){
  speechSynthesis?.cancel();
  lesson.i++;
  Object.assign(lesson,{state:"ask",sel:null,heard:"",hint:false,autoplayed:false,fbTitle:null,fbNote:"",selfJudged:false});
  if(lesson.i>=lesson.queue.length) return finish();
  renderEx();
}
function finish(){
  const perfect = lesson.mistakes===0;
  const xp = 10 + (perfect?5:0) + (lesson.L.dialog?5:0);
  const wasGoal = S.daily.xp>=S.goal;
  addXP(xp);
  if(lesson.id){
    const stars = perfect?3: lesson.mistakes<=2?2:1;
    S.done[lesson.id] = Math.max(S.done[lesson.id]||0, stars);
  }
  save();
  lesson.result = {xp, perfect, goalNow: !wasGoal && S.daily.xp>=S.goal};
  view="result"; render();
}
function renderResult(){
  const r=lesson.result;
  const acc = Math.round(lesson.correct/Math.max(1,lesson.correct+lesson.mistakes)*100);
  $app.innerHTML = `<div class="result pop">
    ${cat("proud",150)}
    <h1>${r.perfect?"Foutloos! 完璧！":"Les voltooid!"}</h1>
    <p style="color:var(--muted);margin:0">${r.goalNow?"🎉 Je hebt je dagdoel gehaald!":`${esc(lesson.L.name)} · ${S.streak.count} ${S.streak.count===1?"dag":"dagen"} op rij 🔥`}</p>
    <div class="stats">
      <div class="stat"><b>+${r.xp}</b><span>XP</span></div>
      <div class="stat"><b>${acc}%</b><span>Goed</span></div>
      <div class="stat"><b>${S.daily.xp}/${S.goal}</b><span>Dagdoel</span></div>
    </div>
    <button class="btn" style="flex:none;width:100%;max-width:360px" onclick="lesson=null;go('home')">Doorgaan</button>
  </div>`;
}

/* ---------- settings ---------- */
function setS(k,v){ if(k==="goal") S.goal=v; else S.settings[k]=v; save(); render(); }
function seg(k,opts,cur){ return `<div class="seg">${opts.map(([v,l])=>`<button class="${cur===v?"on":""}" onclick='setS("${k}",${JSON.stringify(v)})'>${l}</button>`).join("")}</div>`; }
function renderSettings(){
  const s=S.settings;
  $app.innerHTML = `<div class="topbar"><button class="iconbtn" onclick="go('home')" aria-label="Terug">←</button><div class="brand">Instellingen</div></div>
  <div class="page">
    <div class="setting"><h3>Dagdoel</h3><p>Een les levert 10–20 XP op.</p>${seg("goal",[[10,"Rustig · 10"],[20,"Normaal · 20"],[30,"Serieus · 30"],[50,"Intens · 50"]],S.goal)}</div>
    <div class="setting"><h3>Spreeksnelheid</h3><p>Hoe snel de Japanse stem praat.</p>${seg("rate",[[0.7,"Langzaam"],[0.9,"Normaal"],[1.05,"Natuurlijk"]],s.rate)}
      <div style="margin-top:10px"><button class="play" onclick="speak('こんにちは、よろしくおねがいします')">🔊 Test de stem</button>
      <span style="color:var(--muted);font-size:.85rem;margin-left:6px">${jaVoice?esc(jaVoice.name):"geen Japanse stem gevonden"}</span></div></div>
    <div class="setting"><h3>Tekst tonen</h3><p>Wil je meer op je gehoor leren? Zet de tekst uit.</p>
      ${seg("romaji",[[true,"Romaji aan"],[false,"Romaji uit"]],s.romaji)}<div style="height:8px"></div>
      ${seg("kana",[[true,"Japans schrift aan"],[false,"Japans schrift uit"]],s.kana)}</div>
    <div class="setting"><h3>Beoordeling van je uitspraak</h3><p>${SR?"Laat de app meeluisteren, of beoordeel jezelf.":"Deze browser heeft geen spraakherkenning, dus je beoordeelt jezelf."}</p>
      ${SR?seg("mode",[["auto","🎙️ App luistert mee"],["self","🙋 Zelf beoordelen"]],s.mode):""}</div>
    <div class="setting"><h3>Thema</h3>${seg("theme",[["auto","Automatisch"],["light","Licht"],["dark","Donker"]],s.theme)}</div>
    <div class="setting"><h3>Voortgang</h3><p>${S.xp} XP · ${learnedPhrases().length} zinnen geleerd · ${Object.keys(S.done).length} lessen gedaan</p>
      <button class="btn coral" style="flex:none;padding:10px 16px;font-size:.95rem" onclick="if(confirm('Alle voortgang wissen?')){S=defaults();save();render();}">Alles wissen</button></div>
    <div style="display:flex;justify-content:center;margin-top:20px">${cat("sleepy",80)}</div>
  </div>`;
}

render();
</script>
</body>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japantalk – Japans leren praten</title>
<style>
@font-face{font-family:Nunito;font-weight:400;src:url(fonts/nunito-400.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:600;src:url(fonts/nunito-600.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;src:url(fonts/nunito-700.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:800;src:url(fonts/nunito-800.woff2) format("woff2")}
:root{
  --bg:#FBF8F4; --card:#FFFFFF; --text:#3D3A44; --muted:#8A8594; --line:#ECE6DF;
  --sage:#B8D8C8; --lav:#CFC6EA; --peach:#F6D2BE; --blue:#C4DCEF; --butter:#F4E6B0;
  --good:#A9D8B8; --good-ink:#3F7A57; --bad:#E9A9A0; --bad-ink:#9A4A40;
  --shadow:0 4px 18px rgba(61,58,68,.08); --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not(.light){
  --bg:#24222A; --card:#2F2C36; --text:#ECE8F2; --muted:#A39DAF; --line:#3B3843;
  --sage:#8FB3A2; --lav:#A59CC4; --peach:#CDA894; --blue:#9CB6CB; --butter:#C9BC8C;
  --good:#7FAE8E; --good-ink:#D6F0DE; --bad:#C28880; --bad-ink:#FBE0DB;
  --shadow:0 4px 18px rgba(0,0,0,.3);
}}
:root.dark{
  --bg:#24222A; --card:#2F2C36; --text:#ECE8F2; --muted:#A39DAF; --line:#3B3843;
  --sage:#8FB3A2; --lav:#A59CC4; --peach:#CDA894; --blue:#9CB6CB; --butter:#C9BC8C;
  --good:#7FAE8E; --good-ink:#D6F0DE; --bad:#C28880; --bad-ink:#FBE0DB;
  --shadow:0 4px 18px rgba(0,0,0,.3);
}

:root{--sky1:#FBEFF2;--sky2:#FBF8F4;--gravel:#EFE9E1;--rake:#E2D9CE}
:root.dark{--sky1:#2F2A3A;--sky2:#24222A;--gravel:#34303A;--rake:#403B47}
@media (prefers-color-scheme: dark){ :root:not(.light){--sky1:#2F2A3A;--sky2:#24222A;--gravel:#34303A;--rake:#403B47} }
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--card);box-shadow:0 -4px 18px rgba(61,58,68,.08);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-weight:800;font-size:.75rem;color:var(--muted);border-radius:12px}
.tabbar button span{font-size:1.35rem;filter:grayscale(.6);opacity:.75}
.tabbar button.on{color:var(--text)}
.tabbar button.on span{filter:none;opacity:1}
.tabpage{padding-bottom:96px}
.scene{margin:6px 18px 0;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.scene-svg{display:block;width:100%;height:auto}
.scene-info{padding:12px 16px 14px}
.scene-info h3{margin:0;font-size:1.05rem;display:flex;justify-content:space-between;gap:8px}
.scene-info h3 small{color:var(--muted);font-weight:700}
.animals{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.animal-chip{font-size:.8rem;font-weight:700;background:var(--bg);border-radius:999px;padding:4px 10px;color:var(--muted)}
.animal-chip.on{color:var(--text);background:color-mix(in srgb,var(--sage) 35%,var(--card))}
.cta{margin:12px 18px 0;width:calc(100% - 36px);display:flex;align-items:center;gap:12px;text-align:left;background:var(--sage);border-radius:18px;padding:14px 16px;font-weight:800;box-shadow:0 4px 0 rgba(61,58,68,.12);color:#3D3A44}
.cta small{display:block;font-weight:600;opacity:.75}
.cta .big{font-size:1.7rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 18px 0}
.mini{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;text-align:left;font-weight:800}
.mini small{display:block;color:var(--muted);font-weight:700;font-size:.8rem;margin-top:2px}
.mini[disabled]{opacity:.55}
.ucard{margin:12px 18px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.ucard .uh{padding:12px 16px;color:#3D3A44}
.ucard .uh h2{margin:0;font-size:1rem}.ucard .uh p{margin:2px 0 0;font-size:.85rem;opacity:.8}
.pills{display:flex;gap:8px;padding:12px}
.blockhead{margin:20px 22px 0;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cando{margin:0;padding:10px 16px 0 34px;font-size:.85rem;color:var(--muted);font-weight:600}
.cando li{margin:2px 0}.cando li.ok{color:var(--good-ink)}.cando li.ok::marker{content:"✓  "}
.pills{flex-wrap:nowrap}
.pill{min-width:0;font-size:.72rem !important;padding:8px 2px !important;flex:1;border-radius:14px;padding:10px 6px;font-weight:800;font-size:.85rem;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.pill.done{background:color-mix(in srgb,var(--sage) 30%,var(--card));border-color:transparent}
.pill.cur{border-color:var(--sage);box-shadow:0 3px 0 var(--sage)}
.pill.locked{color:var(--muted);opacity:.6}
.garden-wrap{margin:6px 18px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.garden-svg{display:block;width:100%;height:auto}
.petal{animation:fall linear infinite}
#treeLayer.sil{filter:brightness(0) invert(1) drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px #F7C1CC)}
#flash.flashing{animation:flash .55s ease-out}@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.spark{animation:spark 1.4s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%{opacity:0;transform:scale(.2) rotate(0)}30%{opacity:1;transform:scale(1.3) rotate(45deg)}100%{opacity:0;transform:scale(.6) rotate(90deg)}}
.ripple{animation:ripple 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.snowflake{animation:snow linear infinite}@keyframes snow{to{transform:translate(-20px,275px)}}
.drift{animation:drift 40s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(40px)}}
.twinkle{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.firefly{animation:ff 3s ease-in-out infinite}@keyframes ff{0%,100%{opacity:.1;transform:translate(0,0)}50%{opacity:1;transform:translate(6px,-6px)}}
.flutter{animation:fl 16s ease-in-out infinite}@keyframes fl{25%{transform:translate(-60px,-22px)}50%{transform:translate(-120px,4px)}75%{transform:translate(-50px,16px)}}
.swim{animation:swim 5s ease-in-out infinite alternate}@keyframes swim{to{transform:translateX(12px)}}
.bob{animation:bob2 2.6s ease-in-out infinite}@keyframes bob2{50%{transform:translateY(-1.5px)}}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}@keyframes sway{50%{transform:rotate(5deg)}}
.buddypick{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.buddypick.on{border-color:var(--sage);box-shadow:0 4px 0 var(--sage)}
.pron{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.pscores{font-size:.85rem;font-weight:700;color:var(--muted)}.pscores b{color:var(--text)}
.pwords{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pw{border-radius:10px;padding:4px 9px;font-family:"Noto Sans CJK JP",sans-serif;font-weight:700;color:#3D3A44;display:inline-flex;flex-direction:column;align-items:center}
.pw small{font-size:.7rem;font-weight:700;margin-top:2px}.pw i{font-style:normal}
.phon{margin-top:4px;font-weight:800;color:var(--good-ink);font-size:.95rem;letter-spacing:.01em}
.obp{color:var(--muted);font-weight:600;max-width:380px;line-height:1.5;margin:6px 0}
.obinput{width:100%;max-width:380px;font:inherit;font-size:1.2rem;font-weight:700;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);margin-top:10px}
.result h2{margin:10px 0 0}
.prow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:none}.pm{flex:1;min-width:0}
.pa{display:flex;align-items:center;gap:4px}.pa button{font-size:1.1rem;padding:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}.dot.s1{background:var(--peach)}.dot.s2{background:var(--butter)}.dot.s3{background:var(--good)}
.scene-svg.editing{touch-action:none}.scene-svg.editing .deco{cursor:grab}
.deco.lifted{filter:drop-shadow(0 4px 4px rgba(61,58,68,.35))}
.warn2{margin:10px 18px 0;background:color-mix(in srgb,var(--butter) 50%,var(--card));border-radius:14px;padding:10px 14px;font-weight:700;font-size:.9rem}
.collect{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 18px 0}
.citem{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 6px;text-align:center;font-weight:800;font-size:.75rem}
.citem span{display:block;font-size:1.6rem;margin-bottom:2px}
.citem b.jp{font-size:.95rem}.visitor{transform-box:fill-box}
.citem.locked{opacity:.45}.citem.locked span{filter:grayscale(1)}
.citem small{display:block;color:var(--muted);font-weight:700}
.sect{margin:18px 22px 0;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-40px,210px) rotate(220deg);opacity:0}}
.hatch{animation:hatch .9s ease}
@keyframes hatch{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.hatch{transform-box:fill-box;transform-origin:center bottom}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.jp{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(14px + var(--safe-top,0px)) 18px 10px}
.brand{font-weight:800;font-size:1.3rem;flex:1;display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--shadow);padding:6px 12px;border-radius:999px;font-weight:700;font-size:.95rem}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-size:1.1rem}

/* home */
.goalcard{margin:6px 18px 8px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;gap:14px;align-items:center}
.goalcard .info{flex:1}
.goalcard h3{margin:0 0 4px;font-size:1.05rem}
.goalcard p{margin:0;color:var(--muted);font-size:.9rem}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:999px;transition:width .4s}
.practice-btn{margin:4px 18px 4px;display:flex;align-items:center;gap:12px;background:var(--lav);border-radius:var(--r);padding:12px 16px;font-weight:700;box-shadow:var(--shadow);text-align:left}
.practice-btn small{display:block;font-weight:600;opacity:.75}
.practice-btn[disabled]{opacity:.5;cursor:default}
.unit{margin:22px 18px 6px}
.unit-head{border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);color:#3D3A44}
.unit-head h2{margin:0;font-size:1.1rem}
.unit-head p{margin:2px 0 0;font-size:.9rem;opacity:.8}
.path{display:flex;flex-direction:column;align-items:center;padding:44px 0 4px;gap:14px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:74px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:800;color:#3D3A44;
  box-shadow:0 6px 0 rgba(61,58,68,.15);transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(61,58,68,.15)}
.node.locked{background:var(--line)!important;color:var(--muted);box-shadow:0 6px 0 rgba(61,58,68,.08)}
.node-label{font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:700;text-align:center;max-width:140px}
.start-bubble{position:absolute;top:-40px;background:var(--card);border-radius:12px;padding:5px 12px;font-weight:800;font-size:.85rem;box-shadow:var(--shadow);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.start-bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--card);border-bottom:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.side-cat{position:absolute;top:0}
.footer-note{color:var(--muted);text-align:center;font-size:.85rem;padding:24px 24px 40px}

/* lesson */
.lesson{flex:1;display:flex;flex-direction:column}
.lesson-top{display:flex;align-items:center;gap:14px;padding:calc(16px + var(--safe-top,0px)) 18px 16px}
.lesson-top .bar{flex:1;margin:0;height:14px}
.closebtn{font-size:1.5rem;color:var(--muted);width:36px;height:36px}
.ex{flex:1;padding:6px 20px 20px;display:flex;flex-direction:column}
.ex-title{font-size:1.35rem;font-weight:800;margin:6px 0 16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.speaker-row{display:flex;gap:16px;align-items:flex-start}
.bubble{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.bubble:before{content:"";position:absolute;left:-10px;top:24px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.big-jp{font-size:1.7rem;font-weight:700;line-height:1.35}
.romaji{color:var(--muted);font-size:1.05rem;margin-top:2px}
.nl{margin-top:8px;font-weight:700}
.play-row{display:flex;gap:10px;margin-top:12px}
.play{display:inline-flex;align-items:center;gap:6px;background:var(--blue);border-radius:12px;padding:8px 14px;font-weight:700;color:#3D3A44}
.play.slow{background:var(--butter)}
.big-play{width:110px;height:110px;border-radius:28px;background:var(--blue);display:grid;place-items:center;margin:10px auto 6px;font-size:2.6rem;box-shadow:0 6px 0 rgba(61,58,68,.12)}
.big-play:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(61,58,68,.12)}
.options{display:grid;gap:10px;margin-top:16px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-weight:700;font-size:1.05rem;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:12px}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 30%,var(--card));box-shadow:0 3px 0 var(--blue)}
.opt .num{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--muted);flex:none}
.opt .sp{font-size:1.2rem}
.prompt-nl{font-size:1.5rem;font-weight:800;margin:4px 0}
.hint{margin-top:10px;color:var(--muted);font-weight:700;text-decoration:underline dotted;text-underline-offset:4px}
.hint-text{margin-top:10px}
.mic-area{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.mic{width:100%;max-width:420px;padding:18px;border-radius:18px;background:var(--sage);font-weight:800;font-size:1.1rem;color:#3D3A44;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 rgba(61,58,68,.15)}
.mic:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(61,58,68,.15)}
.mic.listening{background:var(--peach);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 rgba(61,58,68,.15),0 0 0 10px color-mix(in srgb,var(--peach) 35%,transparent)}}
.linkbtn{color:var(--muted);font-weight:700;font-size:.9rem;padding:6px}
.heard{color:var(--muted);font-size:.95rem;text-align:center;min-height:1.3em}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:85%;border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.msg.cat{background:var(--card);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:color-mix(in srgb,var(--sage) 55%,var(--card));align-self:flex-end;border-top-right-radius:4px}
.msg .jp{font-weight:700;font-size:1.15rem}
.msg .r{color:var(--muted);font-size:.85rem}
.msg .t{font-size:.85rem;margin-top:2px}
.msg button{font-size:.85rem;margin-top:4px;color:var(--muted);font-weight:700}
.storycard{display:flex;gap:12px;align-items:center;text-align:left;width:calc(100% - 36px);padding:12px 16px;background:color-mix(in srgb,var(--lav) 35%,var(--card))}
.storycard small{display:block;color:var(--muted);font-weight:700}.storycard.locked{opacity:.55}
.storybars{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sbar{height:12px;border-radius:999px;background:var(--line);transition:background .2s}
.sbar.on{background:var(--sage)}
.prow.reading{background:color-mix(in srgb,var(--sage) 25%,var(--card))}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 35%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 30%,var(--card))}
.oldbadge{display:inline-block;font-size:.78rem;font-weight:800;background:color-mix(in srgb,var(--lav) 45%,var(--card));border-radius:999px;padding:3px 10px;margin-bottom:6px}
.lvl{display:block;font-size:.6rem;letter-spacing:1px;color:var(--good-ink)}
.scene-label{align-self:center;font-weight:800;font-size:.85rem;background:color-mix(in srgb,var(--butter) 45%,var(--card));border-radius:999px;padding:4px 12px}
.scene-label span{color:var(--muted);font-weight:700}
.chat-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.actionbar{position:sticky;bottom:0;padding:16px 20px calc(18px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line)}
.actionbar.good{background:color-mix(in srgb,var(--good) 35%,var(--bg));border-color:transparent}
.actionbar.bad{background:color-mix(in srgb,var(--bad) 35%,var(--bg));border-color:transparent}
.fb{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.fb h4{margin:0;font-size:1.2rem}
.good .fb h4{color:var(--good-ink)}
.bad .fb h4{color:var(--bad-ink)}
.fb p{margin:2px 0 0;font-size:.95rem}
.btnrow{display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:16px;font-weight:800;font-size:1.05rem;background:var(--sage);color:#3D3A44;box-shadow:0 4px 0 rgba(61,58,68,.15)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(61,58,68,.15)}
.btn.secondary{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.coral{background:var(--bad)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:default;transform:none}

/* result */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(30px + var(--safe-top,0px)) 24px 30px;text-align:center;gap:10px}
.result h1{margin:8px 0 0;font-size:1.8rem}
.stats{display:flex;gap:12px;margin:14px 0 24px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 18px;min-width:96px}
.stat b{display:block;font-size:1.4rem}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}

/* settings */
.page{padding:6px 18px 40px}
.setting{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.setting h3{margin:0 0 4px;font-size:1rem}
.setting p{margin:0 0 10px;color:var(--muted);font-size:.9rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:8px 14px;border-radius:12px;border:2px solid var(--line);font-weight:700}
.seg button.on{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 40%,var(--card))}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;font-size:.9rem;max-width:90vw}
.pop{animation:pop .35s ease}

/* ---------- Dutch pronunciation helper: romaji → how a Dutch speaker should read it ----------

const PH_CONS = {sh:"sj", ch:"tsj", j:"dzj", y:"j", ts:"ts", ky:"kj", gy:"gj", ny:"nj", hy:"hj", by:"bj", py:"pj", my:"mj", ry:"rj"};

function phonWord(w){
  w=w.toLowerCase().replace(/[^a-zāīūēō']/g,"");
  const re=/(ky|gy|ny|hy|by|py|my|ry|sh|ch|ts|[kgsztdnhbpmyrwfjv])?([aiueoāīūēō])|n'?(?![aiueoāīūēōy])|([kstpc])(?=\3|ch)/g;
  const out=[]; let m;
  while((m=re.exec(w))){
    if(m[3]){ out.push({gem:true}); continue; }                       // small tsu: double consonant
    if(!m[2]){ if(out.length){ const prev=out[out.length-1]; prev.t+= /^[bpm]/.test(w.slice(re.lastIndex)) ? "m" : "n"; } else out.push({t:"n"}); continue; }
    const c=m[1]?(PH_CONS[m[1]]??m[1]):"", v=m[2];
    const prev=out[out.length-1];
    // vowel-only mora after a syllable: long vowels and diphthongs
    if(!c && prev && !prev.gem && prev.t){
      const last=prev.v;
      if(v==="i" && last==="i"){ prev.t=prev.t.replace(/ie$/,"ieː"); prev.v="ii"; continue; }
      if(v==="i" && (last==="a"||last==="o")){ prev.t+= "i"; prev.v=v; continue; }   // ai, oi
      if(v==="i" && last==="e"){ prev.t+="e"; prev.v="ee"; continue; }                              // ei → ee
      if(v===last && (v==="a"||v==="e"||v==="o")){ prev.t+=v; continue; }
      if(v==="u" && last==="o"){ prev.t+="o"; continue; }                                            // ou → oo
    }
    out.push({t:c+PH_VOW[v], v});
  }

  for(let i=0;i<out.length;i++) if(out[i].gem){ const nx=out[i+1], pv=out[i-1]; if(nx&&pv) pv.t+=nx.t.startsWith("tsj")?"t":nx.t[0]; out.splice(i,1); i--; }

  // devoiced u/i: desu → des, masu → mas, mashita → masj·ta, shite → sjte
  const j=syl.join("·");
  return j.replace(/(de|ma)·soe$/,"$1s").replace(/(de|ma)·soe·/g,"$1s·").replace(/·sjie·ta$/,"sj·ta").replace(/^sjie·te$/,"sjte").replace(/·sjie·te$/,"sj·te");

function lev(a,b){

const strict = () => STRICT[S.settings.strict] || STRICT.streng;

  const targets=[p.ja,p.kana,...(p.alt||[])].map(norm), st=strict();
  let best=0;
  for(const h of heard.slice(0, st.alts)){ const hn=norm(h); if(!hn) continue;

      if(st.extra && t.length>=4 && hn.includes(t)) sc=Math.max(sc,0.95);   // said extra words around it

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function distractors(p, n){
  const u=UNITS[p.unit];
  let pool = [...u.phrases, ...u.patternPhrases, ...u.hear].filter(x=>x!==p && x.nl!==p.nl && x.ja!==p.ja);
  if(p.kind==="hear") pool = pool.sort((a,b)=>(b.kind==="hear")-(a.kind==="hear"));   // prefer other things locals say
  if(pool.length<n) pool = pool.concat(Object.values(PHRASES).filter(x=>x.unit!==p.unit));
  return pick(pool, n);
}
function buildLesson(L){
  const ex=[];
  if(L.pattern){
    const ps=L.phrases, u=UNITS[L.ui];
    ex.push({type:"tip", text:u.pattern.tip, p:ps[0]});
    ex.push({type:"intro", p:ps[0]});
    for(let i=1;i<ps.length;i++) ex.push({type:"swap", p:ps[i], model:ps[i-1]});
    const tail = [...pick(ps,2).map(p=>({type:"listen",p})), ...ps.map(p=>({type:"speak",p}))];
    return ex.concat(shuffle(tail));
  }
  if(L.hear){
    const hs=L.phrases;
    hs.forEach(p=>ex.push({type:"hearIntro", p}));
    const quiz = hs.map(p=>({type:"listen", p}));
    hs.filter(p=>p.reply && PHRASES[p.reply]).forEach(p=>quiz.push({type:"respond", q:p, p:PHRASES[p.reply]}));
    return ex.concat(shuffle(quiz));
  }
  if(L.dialog){
    pick(L.phrases,4).forEach((p,i)=>ex.push({type: i%2? "listen":"speak", p}));
    const lines = UNITS[L.ui].dialog.map(l => l.ref ? {...PHRASES[l.ref], who:"me"} : l);
    lines.forEach((l,i)=>{ if(l.who==="me") ex.push({type:"dialog", lines, idx:i, p:l}); });
    const u=UNITS[L.ui];
    if(u.branch) ex.push({type:"branch", node:u.branch.start, hist:[], p:PHRASES[u.branch.nodes[u.branch.start].options[0]?.ref]||lines[0]});
    return ex;
  }
  // ladder per phrase: hear+repeat (all text) → repeat (romaji only) → repeat by ear → recognise → say it yourself (with a hint)
  // each new phrase comes back after another one, so it isn't "seen once, now recall it"
  const ps=L.phrases;
  ps.forEach((p,i)=>{
    ex.push({type:"intro",p});
    const chain=backchain(p);
    chain.forEach((t,k)=>ex.push({type:"build", p:t, full:p, step:k+1, steps:chain.length+1}));
    if(chain.length) ex.push({type:"build", p, full:p, step:chain.length+1, steps:chain.length+1, last:true});
    ex.push({type:"echo",p});
    if(i>0){ ex.push({type:"shadow",p:ps[i-1]}); ex.push({type:"listen",p:ps[i-1]}); }
  });
  const last=ps[ps.length-1];
  ex.push({type:"shadow",p:last}); ex.push({type:"listen",p:last});
  const tail = shuffle(ps).map(p=>({type:"speak",p,scaffold:true}));
  pick(ps,Math.min(2,ps.length)).forEach(p=>tail.push({type:"choose",p}));
  return ex.concat(shuffle(tail));
}

      const R = (b.depth===5?6:b.depth===4?7:8);

        leaves += `<g opacity="${(1-bp).toFixed(2)}">${leafCluster(ex, ey, s, b.rot)}</g>`;
      }
      if(bp>0){   // a soft pink cloud with real five-petal sakura flowers on top
        const s=R*1.25*bp;
        blossoms += `<circle cx="${ex.toFixed(1)}" cy="${(ey+s*.15).toFixed(1)}" r="${(s*1.05).toFixed(1)}" fill="url(#blobG)" opacity=".9"/>`;
        for(let k=0;k<3;k++){
          const ang=b.rot+k*2.1, rr=s*.55, fx=ex+Math.cos(ang)*rr, fy=ey+Math.sin(ang)*rr*.8, fs=s*(1.15-k*.12);
          blossoms += `<use href="#sakura" x="${(fx-fs/2).toFixed(1)}" y="${(fy-fs/2).toFixed(1)}" width="${fs.toFixed(1)}" height="${fs.toFixed(1)}" transform="rotate(${((b.rot*57+k*37)%72).toFixed(0)} ${fx.toFixed(1)} ${fy.toFixed(1)})"/>`;
        }

  }

// a leaf cluster: a darker underside and two lit blobs, so it has some depth
function leafCluster(x, y, s, rot){
  return `<circle cx="${(x+s*.15).toFixed(1)}" cy="${(y+s*.35).toFixed(1)}" r="${(s*.95).toFixed(1)}" fill="url(#leafB)"/>`

// what grew between two moments: new branches, longer branches, new leaves and blossoms (with positions for sparkles)
function treeDiff(g0, g1, seed){
  const d={branches:0, longer:0, leaves:0, blossoms:0, spots:[]};
  if(g1<.05){ if(g1>g0) d.sprout=true; return d; }
  for(const b of treeShape(seed)){
    const p0=clamp01((g0-b.t0)/b.span), p1=clamp01((g1-b.t0)/b.span);
    const ex=b.x+(b.ex-b.x)*p1, ey=b.y+(b.ey-b.y)*p1;
    if(p0<=0 && p1>0){ d.branches++; d.spots.push([ex,ey,"b"]); }
    else if(p1>p0) d.longer++;
    const lpAt = g => b.depth<3 ? clamp01((g-b.t0-b.span*.5)/.08) : clamp01((g-b.t0-b.span*.5)/.1);
    if(lpAt(g0)<.5 && lpAt(g1)>=.5){ d.leaves++; d.spots.push([ex,ey,"l"]); }
    if(b.depth>=3){ const bpAt=g=>clamp01((g-b.bloom)/.07); if(bpAt(g0)<.5 && bpAt(g1)>=.5){ d.blossoms++; d.spots.push([ex,ey,"f"]); } }
  }
  return d;
}

  if(S.bonusVisit.ids.length>=3 || Math.random()>.4) return null;

function mixHex(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const x=p(a), y=p(b); return "#"+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,"0")).join(""); }

function sceneSVG(g, tree, {sky=true, petals=true, highlight=null, decos=true, edit=false, evolve=false}={}){
  const tod=timeOfDay(), set=ANIMAL_SETS[tree.set||0], out={};
  const treeMarkup=treeSVG(g, tree.seed, out);
  const have = decos ? earnedIds() : new Set();
  const D = id => have.has(id) ? `<g class="${highlight===id?"hatch":""}">${decoSVG(id,tod)}</g>` : "";
  const movable = Object.keys(DECO_ANCHOR).filter(id=>have.has(id)).map(id=>[id, decoPos(id)[1]]).sort((a,b)=>a[1]-b[1]);
  const back  = movable.filter(([,y])=>y<224).map(([id])=>placedDeco(id,tod,highlight,edit)).join("");
  const front = movable.filter(([,y])=>y>=224).map(([id])=>placedDeco(id,tod,highlight,edit)).join("");
  let animals="";
  for(const a of set){
    const ag=animalGrowth(a,g); if(ag<0) continue;
    const [x,y,flip]=animalSpot(a.id, out.perch);
    const cls = a.id==="koi"||a.id==="kame" ? "swim" : "bob";
    animals += `<g class="${highlight===a.id?"hatch ":""}${cls}">${animalSVG(a.id,x,y,.5+.5*ag,flip)}</g>`;
  }
  return `<svg viewBox="0 0 300 260" class="scene-svg ${edit?"editing":""}" ${edit?'id="gscene"':""} aria-label="Je sakura-boom in de zen-tuin">
    ${sky ? skySVG(tod) + D("lamps") + fenceSVG() : `<defs><radialGradient id="glow"><stop offset="0" stop-color="#FFF3B0" stop-opacity=".9"/><stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/></radialGradient></defs>`}
    ${artDefs()}${groundSVG()}${pondSVG()}
    ${back}
    <g id="${evolve?"treeLayer":""}">${treeMarkup}</g>
    ${front}
    ${animals}
    ${sky ? visitorsLayer(out.perch) : ""}
    ${sky ? lifeSVG(tod) + seasonParticles() : ""}
    ${petals && g>=.8 ? petalsSVG(Math.round((g-.75)*30), tree.seed) : ""}
    ${evolve?`<g id="sparkLayer"></g><rect id="flash" width="300" height="260" fill="#fff" opacity="0"/>`:""}
  </svg>`;
}
function gardenSVG(){
  const trees=S.garden;
  const rows=Math.max(1,trees.length);
  let plots="";
  trees.forEach((t,i)=>{
    const x = i%2 ? 150 : 0, y = i*170;
    plots += `<g transform="translate(${x} ${y})"><svg x="0" y="0" width="300" height="260" viewBox="0 0 300 260">${sceneSVG(1,t,{sky:false,petals:true,decos:false}).replace(/^<svg[^>]*>|<\/svg>$/g,"")}</svg>
      <text x="150" y="258" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="13" fill="var(--muted)">Boom ${t.n} · ${fmtDate(t.done)}</text></g>`;
  });
  const H = Math.max(300, rows*170+110);
  return `<svg viewBox="0 0 450 ${H}" class="garden-svg">
    <defs><pattern id="rake" width="40" height="14" patternUnits="userSpaceOnUse"><path d="M0 7 q10 -5 20 0 t20 0" stroke="var(--rake)" stroke-width="1.3" fill="none"/></pattern></defs>
    <rect width="450" height="${H}" fill="var(--gravel)"/><rect width="450" height="${H}" fill="url(#rake)"/>
    ${plots}
  </svg>`;
}

function isUnlocked(ui,li){
  if(ui===0&&li===0) return true;
  const prev = li>0 ? lessonId(ui,li-1) : lessonId(ui-1, lessonsOf(ui-1).length-1);
  return !!S.done[prev];
}
function currentLesson(){
  for(let u=0;u<UNITS.length;u++) for(let l=0;l<lessonsOf(u).length;l++) if(!S.done[lessonId(u,l)] && isUnlocked(u,l)) return [u,l];
  return null;
}

const KANA_TABLE = (()=>{ const t={}, V=["a","i","u","e","o"];
  const rows={"":"アイウエオ",k:"カキクケコ",g:"ガギグゲゴ",s:"サシスセソ",z:"ザジズゼゾ",n:"ナニヌネノ",h:"ハヒフヘホ",b:"バビブベボ",p:"パピプペポ",m:"マミムメモ",r:"ラリルレロ"};
  for(const c in rows) V.forEach((v,i)=>t[c+v]=rows[c][i]);
  Object.assign(t,{ta:"タ",ti:"ティ",tu:"トゥ",te:"テ",to:"ト",da:"ダ",di:"ディ",du:"ドゥ",de:"デ",do:"ド",fa:"ファ",fi:"フィ",fu:"フ",fe:"フェ",fo:"フォ",
    ya:"ヤ",yi:"イ",yu:"ユ",ye:"イェ",yo:"ヨ",wa:"ワ",wi:"ウィ",wu:"ウ",we:"ウェ",wo:"ウォ",va:"ヴァ",vi:"ヴィ",vu:"ヴ",ve:"ヴェ",vo:"ヴォ",
    sha:"シャ",shi:"シ",shu:"シュ",she:"シェ",sho:"ショ",cha:"チャ",chi:"チ",chu:"チュ",che:"チェ",cho:"チョ",tsu:"ツ",ja:"ジャ",ji:"ジ",ju:"ジュ",je:"ジェ",jo:"ジョ"});
  return t; })();
function nameToKata(name){   // rough Dutch spelling → katakana (the microphone option is more accurate)
  let r=name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"")
    .replace(/sch/g,"sk").replace(/ch/g,"h").replace(/ph/g,"f").replace(/th/g,"t").replace(/oe/g,"u").replace(/ie/g,"i-").replace(/ij|ei/g,"ei").replace(/ui/g,"ai").replace(/eu/g,"e-")
    .replace(/aa/g,"a-").replace(/ee/g,"e-").replace(/oo/g,"o-").replace(/uu/g,"yu").replace(/j/g,"y").replace(/l/g,"r").replace(/c/g,"k").replace(/q/g,"k").replace(/x/g,"ks").replace(/v/g,"f");
  let out="";
  for(let i=0;i<r.length;){
    if(r[i]==="-"){ out+="ー"; i++; continue; }
    let hit=false;
    for(const L of [3,2,1]){ const ch=r.slice(i,i+L); if(KANA_TABLE[ch]){ out+=KANA_TABLE[ch]; i+=L; hit=true; break; } }
    if(hit) continue;
    const c=r[i], nx=r[i+1];
    if(c==="n"){ out+="ン"; i++; continue; }
    if(nx===c){ out+="ッ"; i++; continue; }
    out += KANA_TABLE[c+((c==="t"||c==="d")?"o":"u")] || ""; i++;
  }
  return out || "トム";
}
function kataToRomaji(k){
  const rev={}; for(const [ro,ka] of Object.entries(KANA_TABLE)) if(!rev[ka]||ro.length<rev[ka].length) rev[ka]=ro;
  let out="";
  for(let i=0;i<k.length;){
    const two=k.slice(i,i+2);
    if(rev[two]){ out+=rev[two]; i+=2; continue; }
    const c=k[i];
    if(c==="ン"){ out+="n"; i++; continue; }
    if(c==="ッ"){ const nx=rev[k[i+1]]||""; out+=nx[0]||""; i++; continue; }
    if(c==="ー"){ out+=out.slice(-1); i++; continue; }
    out+=rev[c]||""; i++;
  }
  return out.charAt(0).toUpperCase()+out.slice(1);
}

/* ---------- Luistermodus: hands-free review, Pimsleur style ---------- */
let lm=null, wakeLock=null;
const wait = ms => new Promise(r=>setTimeout(r,ms));
function beep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type="sine"; o.frequency.value=988;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.18);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.2); }catch(e){} }

function listenItems(){
  ensureSrs();
  const ok=k=>{ const p=phraseByKey(k); return p && p.kind!=="hear"; };
  let due=dueKeys().filter(ok);
  const rest=Object.keys(S.srs).filter(k=>ok(k) && !due.includes(k)).sort((a,b)=>(S.srs[a].iv-S.srs[b].iv)||(S.srs[b].lapses-S.srs[a].lapses));
  return shuffle([...due.slice(0,12), ...rest.slice(0, Math.max(0, 12-due.length))]).map(phraseByKey);
}
async function startListenMode(){
  const items=listenItems();

  lm={items, i:0, correct:0, mistakes:0, title:"", jp:"", nl:"", mood:"talking", stop:false};

  await sayNL("Ik zeg een zin in het Nederlands. Na de piep zeg jij hem in het Japans.");
  for(; me.i<me.items.length; me.i++){

    lmShow("Hoe zeg je…", p.nl, "", "curious");
    await sayNL("Hoe zeg je: "+p.nl.replace(/\(.*?\)/g,"").replace(/\s*\/\s*/g," of "));
    if(!alive()) return;

    const sc=score(heard,p), ok=sc>=strict().pass;
    if(ok){ me.correct++; chime(true); lmShow("Goed! ✓", p.nl, p.ja, "happy"); await sayNL("Goed."); await speak(p.ja); }

      await sayNL(heard.length?"Bijna. Luister.":"Luister."); if(!alive()) return;

let phraseFilter="all";
function strength(k){ const c=(S.srs||{})[k]; if(!c) return 0; return c.iv>=16?3 : c.iv>=3?2 : 1; }
function toggleFav(k){ S.fav=S.fav||{}; if(S.fav[k]) delete S.fav[k]; else S.fav[k]=1; save(); renderPhrases(); }
function renderPhrases(){
  ensureSrs(); S.fav=S.fav||{};
  const known=k=>S.srs[k]||S.ph[k];
  const tricky=k=>{ const c=S.srs[k]; return c && (c.lapses>0 || (S.ph[k]&&S.ph[k].s<=1)); };
  const keep=p=>known(p.ja) && (phraseFilter==="all" || (phraseFilter==="fav"&&S.fav[p.ja]) || (phraseFilter==="hard"&&tricky(p.ja)));
  const seen=new Set(); let total=0, solid=0, body="";
  UNITS.forEach((u,ui)=>{
    const items=[...u.phrases, ...u.patternPhrases, ...u.hear].filter(p=>{ if(seen.has(p.ja)) return false; seen.add(p.ja); if(known(p.ja)){ total++; if(strength(p.ja)===3) solid++; } return keep(p); });
    if(!items.length) return;
    body+=`<h3 class="sect">${esc(u.title)}</h3><div class="ucard" style="margin-top:8px">${items.map(p=>{
      const st=strength(p.ja), js=JSON.stringify(p.ja).replace(/"/g,"&quot;");
      return `<div class="prow" onclick="speak(${js})">
        <div class="pm"><div class="jp" style="font-weight:700;font-size:1.1rem">${p.kind==="hear"?"👂 ":""}${esc(p.ja)}</div>
          ${S.settings.romaji?`<div class="romaji" style="font-size:.9rem">${esc(p.romaji)}</div>`:""}${p.kind!=="hear"&&showPhon(p)?phonLine(p):""}<div style="font-size:.9rem;font-weight:600">${esc(p.nl)}</div></div>
        <div class="pa"><span class="dot s${st}" title="${["","nieuw","bezig","zit erin"][st]}"></span>
          <button onclick="event.stopPropagation();speak(${js},.6)" aria-label="Langzaam">🐢</button>
          ${p.kind!=="hear" && AUDIO[p.ja] ? `<button onclick="event.stopPropagation();openMelody(${js})" aria-label="Vergelijk melodie">🎵</button>`:""}
          <button onclick="event.stopPropagation();toggleFav(${js})" aria-label="Favoriet">${S.fav[p.ja]?"⭐":"☆"}</button></div>
      </div>`;}).join("")}</div>`;
  });
  const chip=(v,l)=>`<button class="${phraseFilter===v?"on":""}" onclick="phraseFilter='${v}';renderPhrases()">${l}</button>`;
  $app.innerHTML=`<div class="tabpage">${topbar("Mijn zinnen")}
    <p style="margin:0 22px;color:var(--muted);font-weight:600">${total} zinnen geleerd · ${solid} zitten er goed in. Tik op een zin om hem te horen.</p>
    <div class="seg" style="margin:10px 18px 0">${chip("all","Alles")}${chip("fav","⭐ Favorieten")}${chip("hard","Lastig")}</div>
    ${body || `<div style="text-align:center;padding:30px 20px">${buddy("sleepy",100)}<p style="color:var(--muted);font-weight:600">${total?"Niets in deze lijst.":"Nog geen zinnen. Na je eerste les staan ze hier, als spiekboekje voor op reis."}</p></div>`}
  </div>${tabbar()}`;
}
let gardenEdit=false, dragging=null;
function attachGardenDrag(){
  const svg=document.getElementById("gscene"); if(!svg) return;
  const toSvg=e=>{ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener("pointerdown",e=>{ const g=e.target.closest(".deco"); if(!g) return;
    const p=toSvg(e), [x,y]=decoPos(g.dataset.id); dragging={id:g.dataset.id, el:g, dx:x-p.x, dy:y-p.y};
    svg.setPointerCapture(e.pointerId); g.classList.add("lifted"); e.preventDefault(); });
  svg.addEventListener("pointermove",e=>{ if(!dragging) return; const p=toSvg(e);
    const x=Math.max(8,Math.min(292,p.x+dragging.dx)), y=Math.max(207,Math.min(258,p.y+dragging.dy));
    S.place=S.place||{}; S.place[dragging.id]={x:Math.round(x),y:Math.round(y)};
    dragging.el.setAttribute("transform", decoTransform(dragging.id)); });
  const drop=()=>{ if(!dragging) return; dragging=null; save();
    document.getElementById("gwrap").innerHTML=sceneSVG(treeGrowth(), S.tree, {edit:true}); attachGardenDrag(); };   // redraw for depth (behind/in front of the tree)
  svg.addEventListener("pointerup",drop); svg.addEventListener("pointercancel",drop);
}

  $app.innerHTML=`<div class="tabpage">${topbar("Zen-tuin")}
    <div class="scene" id="gwrap">${sceneSVG(g, S.tree, {edit:gardenEdit})}</div>
    ${gardenEdit
      ? `<div class="warn2">✋ Sleep je decoraties naar een plek rond de boom.</div>
         <div class="btnrow" style="margin:10px 18px 0"><button class="btn secondary" onclick="S.place={};save();renderGarden()">Standaardplekken</button><button class="btn" onclick="gardenEdit=false;renderGarden()">Klaar</button></div>`
      : Object.keys(DECO_ANCHOR).some(id=>have.has(id))
        ? `<button class="cta" onclick="gardenEdit=true;renderGarden()"><span class="big">✏️</span><span>Tuin inrichten<small>Zet je decoraties waar jij ze wilt</small></span></button>`
        : `<p style="margin:10px 22px 0;color:var(--muted);font-weight:600">🎁 Rond je eerste unit af en verdien een stenen lantaarn voor je tuin.</p>`}
    <h3 class="sect">Decoraties · ${have.size}/${DECOS.length}</h3>
    <div class="collect">${DECOS.map((d,i)=>`<div class="citem ${have.has(d.id)?"":"locked"}"><span>${d.emoji}</span>${esc(d.name)}${have.has(d.id)?"":`<small>Unit ${i+1}</small>`}</div>`).join("")}</div>
    <h3 class="sect">Diertjes · ${new Set(animals.map(a=>a.id)).size}/${allAnimals.length}</h3>
    <div class="collect">${allAnimals.map(a=>{const got=animals.some(x=>x.id===a.id);
      return `<div class="citem ${got?"":"locked"}"><span>${got?a.emoji:"🥚"}</span>${esc(a.name.split(" (")[0])}${got?"":"<small>komt nog</small>"}</div>`;}).join("")}</div>
    <h3 class="sect">図鑑 Dierenboek · ${Object.keys(S.zukan||{}).filter(k=>VISITORS.some(v=>v.id===k)).length}/${VISITORS.length}</h3>
    <p style="margin:2px 22px 0;color:var(--muted);font-weight:600;font-size:.85rem">Bezoekers verschillen per seizoen en tijdstip. Tik ze aan in je tuin om ze te verzamelen.</p>
    <div class="collect">${VISITORS.map(v=>{ const got=S.zukan&&S.zukan[v.id];
      return `<button class="citem ${got?"":"locked"}" onclick="${got?`speak('${v.kana}');toast(${JSON.stringify(v.fact).replace(/"/g,"&quot;")})`:`toast('Nog niet gezien · ${RARITY[v.r].nl}')`}">
        <svg viewBox="${v.id==="kinkoi"||v.id==="tonbo"?"-26 -20 52 30":v.id==="kyubi"?"-26 -44 58 48":"-24 -36 48 40"}" width="54" height="45" style="${got?"":"filter:grayscale(1) brightness(1.6) opacity(.5)"}">${v.id==="ryu"?`<g transform="scale(.3)">${visitorSVG(v.id,-10,-30)}</g>`:visitorSVG(v.id,0,0)}</svg>
        ${got?`<b class="jp">${v.ja}</b><small>${v.romaji} · ${v.nl}</small>`:`<b>?</b><small>${RARITY[v.r].nl}</small>`}${RARITY[v.r].stars?`<small>${RARITY[v.r].stars}</small>`:""}</button>`; }).join("")}</div>
    <h3 class="sect">Volgroeide bomen · ${n}</h3>
    ${n?`<div class="garden-wrap">${gardenSVG()}</div>`:
      `<p style="margin:6px 22px 0;color:var(--muted);font-weight:600">Boom ${S.tree.n} staat op ${Math.round(g*100)}%. In volle bloei komt hij hier te staan, met zijn diertjes. Nog ±${daysLeft(g)} dagen goed oefenen.</p>`}
  </div>${tabbar()}`;
  if(gardenEdit) attachGardenDrag();
}
// TEMPORARY test helpers (settings → Testen)
function testGrow(frac){
  ensureGarden(); let days=frac*TREE_DAYS, i=0;
  while(days>0 && treeGrowth()<1){ const d=Math.min(DAY_CAP,days); S.tree.xp[`test-${Date.now()}-${i++}`]=d*S.goal; days-=d; }
  save(); toast(`Boom staat nu op ${Math.round(treeGrowth()*100)}%`); render();
}
function testReset(){ ensureGarden(); S.tree.xp={}; save(); render(); }
function plantTree(){
  ensureGarden(); if(treeGrowth()<1) return;
  S.garden.push({...S.tree, done:today()});
  S.tree = newTree(S.tree.n+1);
  save(); view="garden"; render();
  toast("Je boom staat in de zen-tuin. Een nieuw zaadje is geplant 🌱");
}

function go(v){ if(v!=="garden") gardenEdit=false; if(view==="learn") window._learnScroll=window.scrollY; view=v; render(); }

/* ---------- lesson flow ---------- */
const LEVEL_NAME = {1:"", 2:"Niveau 2 · Herhaling", 3:"Niveau 3 · Uit je hoofd"};
function levelOf(id){ return (S.lvl&&S.lvl[id]) || (S.done[id]?1:0); }
// a few older phrases mixed into a new lesson (weakest / due first), so old material keeps coming back
function oldMix(L, n=4){
  ensureSrs();
  const here=new Set((L.phrases||[]).map(p=>p.ja));
  const keys=Object.keys(S.srs).filter(k=>{ const p=phraseByKey(k); return p && p.kind!=="hear" && !here.has(k); })
    .sort((a,b)=>(S.srs[a].due<S.srs[b].due?-1:1) || (S.srs[a].iv-S.srs[b].iv));
  return keys.slice(0,n).map((k,i)=>({type:i%2?"listen":"speak", p:phraseByKey(k), old:true, review:S.srs[k].due<=today()}));
}
function levelUp(ex, L, level){
  if(level<=1) return ex;
  const ps=L.phrases||[];
  if(L.dialog) return ex;
  if(L.hear) return shuffle([...ps.map(p=>({type:"listen",p})), ...ps.filter(p=>p.reply&&PHRASES[p.reply]).map(p=>({type:"respond",q:p,p:PHRASES[p.reply]}))]);
  if(level===2) return shuffle(ps.flatMap(p=>[{type:"shadow",p},{type:"listen",p},{type:"speak",p,scaffold:true}]));
  return shuffle(ps.flatMap(p=>[{type:"speak",p},{type:"speak",p}]));        // level 3: from memory, twice each
}
function startLesson(ui,li){
  const L = lessonsOf(ui)[li], id=lessonId(ui,li), level=S.done[id] ? Math.min(3, levelOf(id)+1) : 1;
  window._homeScroll=window.scrollY;
  let q=levelUp(buildLesson(L), L, level);
  if(!L.dialog){   // weave in older phrases in the second half
    const old=oldMix(L, level===1?3:4);
    old.forEach((o,k)=>q.splice(Math.min(q.length, Math.floor(q.length*.5)+k*3), 0, o));
  }
  lesson = { L, id, level, queue:q, i:0, total:0, mistakes:0, correct:0, state:"ask", noMic:false, sel:null, heard:"", attempt:0, retried:new Set() };
  lesson.total = lesson.queue.length;
  view="lesson"; render();
}
function startPractice(){
  window._homeScroll=window.scrollY;
  const r=buildPractice();
  lesson = { L:{name: r.extra?"Extra herhalen":"Herhalen", review:true}, id:null, queue:r.ex, i:0, total:0, mistakes:0, correct:0, state:"ask", noMic:false, sel:null, heard:"", attempt:0, retried:new Set() };
  lesson.total = lesson.queue.length;
  view="lesson"; render();
}
function quitLesson(){
  if(lesson && lesson.i>0 && !confirm("Les stoppen? Je voortgang in deze les gaat verloren.")) return;
  stopListening(); stopAudio(); lesson=null; view="home"; render();
}
function curEx(){ return lesson.queue[lesson.i]; }
function effType(ex){
  if(lesson.noMic && (ex.type==="speak"||ex.type==="swap"||ex.type==="respond")) return "choose";
  if(lesson.noMic && (ex.type==="echo"||ex.type==="shadow")) return "listen";
  if(lesson.noMic && ex.type==="build") return "intro";
  return ex.type;
}

      :`<div class="card" style="text-align:center;font-weight:800">🎉 Gesprek gelukt!</div>`}`;
  }

          <div class="jp">${esc(l.ja)}</div>${S.settings.romaji?`<div class="r">${esc(l.romaji)}</div>`:""}<div class="t">${esc(l.nl)}</div>

          ${lesson.hint?`<div class="hint-text">${jpBlock(p,false)}</div><button onclick="say()">🔊 voorbeeld</button>`:`<button class="hint" onclick="lesson.hint=true;renderEx()">💡 Hint</button>`}
        </div></div>

  }

  body = badge + body;
  $app.innerHTML = `<div class="lesson">
    <div class="lesson-top"><button class="closebtn" onclick="quitLesson()" aria-label="Stoppen">✕</button>
      <div class="bar"><i style="width:${prog}%"></i></div></div>
    <div class="ex pop">${body}</div>
    ${actionBar(t)}
  </div>`;
  if(t==="branch"||t==="dialog") requestAnimationFrame(()=>window.scrollTo(0, document.body.scrollHeight));   // keep the newest line in view
  // auto audio
  if(lesson.state==="ask" && !lesson.autoplayed){
    lesson.autoplayed=true;
    const still = () => view==="lesson" && lesson && curEx()===ex;   // user may already have moved on
    if(t==="intro"||t==="listen"||t==="hearIntro"||t==="echo"||t==="shadow"||t==="build") setTimeout(()=>still()&&say(),250);
    if(t==="respond") setTimeout(()=>still()&&sayQ(),250);
    if(t==="branch") setTimeout(()=>still()&&branchSay(),250);
    if(t==="dialog"){ const prev=ex.lines[ex.idx-1]; if(prev&&prev.who==="cat") setTimeout(()=>still()&&sayLine(ex.idx-1),250); }

}
/* ---------- backchaining: build long sentences from the end (desu ka → nan desu ka → o-namae wa nan desu ka) ---------- */
const R2K = (()=>{ const t={}, V=["a","i","u","e","o"], rows={"":"あいうえお",k:"かきくけこ",g:"がぎぐげご",s:"さしすせそ",z:"ざじずぜぞ",t:"たちつてと",d:"だぢづでど",n:"なにぬねの",h:"はひふへほ",b:"ばびぶべぼ",p:"ぱぴぷぺぽ",m:"まみむめも",y:"や-ゆ-よ",r:"らりるれろ",w:"わ---を"};
  for(const c in rows) V.forEach((v,i)=>{ if(rows[c][i]!=="-") t[c+v]=rows[c][i]; });
  Object.assign(t,{shi:"し",chi:"ち",tsu:"つ",fu:"ふ",ji:"じ"});
  for(const [c,k] of Object.entries({ky:"き",gy:"ぎ",sh:"し",ch:"ち",j:"じ",ny:"に",hy:"ひ",by:"び",py:"ぴ",my:"み",ry:"り"})) for(const [v,sm] of [["a","ゃ"],["u","ゅ"],["o","ょ"]]) t[c+v]=k+sm;
  return t; })();
const PARTICLE = {wa:"は", o:"を", e:"へ"};
function romajiToHira(word){   // one romaji word → list of possible hiragana spellings (ō can be おう or おお)
  if(PARTICLE[word]) return [PARTICLE[word]];
  let outs=[""];
  const w=word.toLowerCase().replace(/[-']/g,"");
  for(let i=0;i<w.length;){
    const ch=w[i];
    const longV={"ā":["ああ"],"ī":["いい"],"ū":["うう"],"ē":["えい","ええ"],"ō":["おう","おお"]};
    let hit=null, len=0;
    for(const L of [3,2,1]){ let piece=w.slice(i,i+L); const last=piece.slice(-1);
      const base = longV[last] ? piece.slice(0,-1)+"aiueo"["āīūēō".indexOf(last)] : piece;
      if(R2K[base]){ hit = longV[last] ? longV[last].map(x=>R2K[base]+x.slice(1)) : [R2K[base]]; len=L; break; } }
    if(hit){ outs=outs.flatMap(o=>hit.map(h=>o+h)); i+=len; continue; }
    if(ch==="n"){ outs=outs.map(o=>o+"ん"); i++; continue; }
    if(w[i+1]===ch || (ch==="t" && w[i+1]==="c")){ outs=outs.map(o=>o+"っ"); i++; continue; }
    return null;
  }
  return outs;
}
const ATTACH = new Set(["wa","o","ga","ni","de","e","to","mo","no","kara","made","ka","ne","yo"]);
function backchain(p){
  const words=p.romaji.replace(/[“”"!?.,…]/g,"").trim().split(/\s+/);
  if(words.length<3 || norm(p.kana).length<8) return [];     // only for longer sentences
  const units=[]; for(const w of words){ const lw=w.toLowerCase(), prev=units[units.length-1];
    if(prev && (ATTACH.has(lw) || (lw==="shimasu" && /onegai$/i.test(prev[prev.length-1])))) prev.push(w); else units.push([w]); }
  if(units.length<3) return [];
  const full=toHira(p.kana.replace(/[、。！？!?\s・「」]/g,"")), steps=[];
  for(let k=units.length-1;k>=1;k--){
    const tailWords=units.slice(k).flat();
    let cands=[""]; for(const w of tailWords){ const h=romajiToHira(w); if(!h) return []; cands=cands.flatMap(c=>h.map(x=>c+x)); }
    const hit=cands.find(c=>full.endsWith(c)); if(!hit) return [];
    const kanaTail=p.kana.replace(/[、。！？!?\s・「」]/g,"").slice(-hit.length);
    if(/[はへ]/.test(hit.slice(0,-1)) && /\b(wa|e)\b/.test(tailWords.join(" "))) continue;   // a particle は/へ inside: the voice might misread it
    steps.push({ja:kanaTail, kana:kanaTail, tts:kanaTail, romaji:tailWords.join(" "), nl:p.nl, alt:[], tail:true, parent:p});
  }
  return steps.slice(-3);
}
function scoreTail(heard, t){   // the recogniser may write kanji: also accept the end of the full sentence in any of its forms
  let best=score(heard, t);
  const forms=[t.parent.ja, t.parent.kana, ...(t.parent.alt||[])].map(norm), need=norm(t.kana).length;
  for(const h of heard.slice(0, strict().alts)){ const hn=norm(h); if(hn.length>=need*.5 && forms.some(f=>f.endsWith(hn))) best=1; }
  return best;
}

// memory aid: first sound of every word ("o-namae wa nan desu ka" → "o-n… wa… na… de… ka…")
function skeleton(r){ return r.split(/\s+/).map(w=>w.length<=2?w+"…":w.slice(0,w[0]==="o"&&w[1]==="-"?3:2)+"…").join(" "); }
function micArea(label){

           ${phonMode()!=="uit"&&ex.p.romaji?`<p style="margin-top:4px">Zo spreek je het uit: <b>${esc(phonetic(ex.p.romaji))}</b></p>`:""}`}
        <button class="play" style="margin-top:6px" onclick="say()">🔊 Luister</button></div></div>

  if(st==="self"){

      <button class="play" style="margin-top:6px" onclick="say()">🔊 Luister</button></div></div>

function say(mult=1){ if(!lesson||view!=="lesson"||!curEx()) return; const ex=curEx(); return speak(ex.p.ja, mult*(ex.p.kind==="hear"?1.1:1)); }
function branchSay(){ const ex=curEx(); if(!ex||ex.type!=="branch") return; const n=UNITS[lesson.L.ui].branch.nodes[ex.node]; speak(n.cat.ja, 1, n.cat.tts); }
function branchGo(i, heardOk=true){
  const ex=curEx(), N=UNITS[lesson.L.ui].branch.nodes, n=N[ex.node], o=n.options[i], p=PHRASES[o.ref];
  ex.hist.push({who:"cat",...n.cat}, {who:"me", ja:p.ja, romaji:p.romaji, nl:p.nl});
  if(p.key) mark(p, heardOk);
  ex.node=o.next; lesson.heard=""; lesson.hint=false; lesson.autoplayed=false;
  if(!N[ex.node].options.length){ branchSay(); lesson.fbNote="Je koos zelf je antwoorden. 会話、上手！"; resolve(!ex.miss); return; }
  renderEx();
}
function branchPick(i){ branchGo(i, true); }
function sayQ(mult=1){ if(!lesson||view!=="lesson"||!curEx()?.q) return; const ex=curEx(); return speak(ex.q.ja, mult*1.1); }
function sayLine(i){ if(!lesson||view!=="lesson"||!curEx()?.lines) return; const l=curEx().lines[i]; speak(l.ja, AUDIO[l.ja] ? 1 : l.fast?1.35:l.slow?0.65:1, l.tts); }   // recordings already have the right tempo
function choose(i, play){
  lesson.sel=i; const ex=curEx();
  if(play) speak(ex.opts[i].ja);
  renderEx();
}
function check(){
  const ex=curEx(); const ok = ex.opts[lesson.sel]===ex.p;
  resolve(ok);
}
async function toggleMic(){
  if(lesson.state==="listening"){ if(azRec) azRec.stop(); stopListening(); return; }
  lesson.state="listening"; lesson.heard=""; renderEx();
  try{
    const heard = await listen();
    if(view!=="lesson"||!lesson) return;
    if(!heard.length){ lesson.state="ask"; lesson.heard=`(niets gehoord – praat iets luider of houd je telefoon dichterbij${lastListenError?` · ${lastListenError}`:""})`; renderEx(); return; }
    if(curEx().type==="branch"){
      const n=UNITS[lesson.L.ui].branch.nodes[curEx().node], pass=strict().pass;
      const scores=n.options.map(o=>score(heard, PHRASES[o.ref])), best=Math.max(...scores), bi=scores.indexOf(best);
      if(best>=pass){ chime(true); lesson.state="ask"; branchGo(bi, true); return; }
      curEx().miss=true; lesson.state="ask"; lesson.heard=`${heard[0]} · ${Math.round(best*100)}%: niet duidelijk genoeg, probeer het nog eens (of tik 💡)`;
      chime(false); renderEx(); return;
    }
    const sc = curEx().p.tail ? scoreTail(heard, curEx().p) : score(heard, curEx().p), pass=strict().pass; lesson.lastScore = sc;
    lesson.heard = `${heard[0]}  ·  ${Math.round(sc*100)}%`;
    lesson.fbNote = sc>=.98 ? `Uitspraak ${Math.round(sc*100)}%: perfect.` : `Uitspraak ${Math.round(sc*100)}%: goed verstaanbaar.`;
    lesson.failNote = sc<pass ? `Ik hoorde “${heard[0]}” (${Math.round(sc*100)}%, nodig: ${Math.round(pass*100)}%).` : "";
    resolve(sc>=pass);
  }catch(err){
    lesson.state="ask"; renderEx();
    if(err==="not-allowed"||err==="service-not-allowed"){
      toast("Geen toegang tot de microfoon. Je kunt jezelf beoordelen (zie Instellingen).");
      S.settings.mode="self"; save(); renderEx();
    } else toast("Spraakherkenning lukte niet ("+err+"). Probeer opnieuw.");
  }
}
function selfJudgeReveal(){ lesson.state="self"; lesson.selfJudged=true; renderEx(); say(); }
function judge(ok){ resolve(ok); }
function noMic(){ lesson.noMic=true; stopListening(); lesson.state="ask"; lesson.autoplayed=false; renderEx(); toast("Oké! De rest van deze les zonder praten 🤫"); }
function skip(){ stopListening(); resolve(false, true); }
function retry(){ lesson.state="ask"; lesson.heard=""; lesson.failNote=""; lesson.melody=null; lesson.fbTitle=null; renderEx(); }

function resolve(ok, skipped=false){
  const ex=curEx();
  lesson.state = ok ? "good" : "bad";
  lesson.fbTitle=null;
  if(ex.type!=="intro" || !lesson.noMic) chime(ok);
  if(!ex.counted){
    ex.counted=true;
    if(ok) lesson.correct++; else lesson.mistakes++;
    if(ex.p.key) mark(ex.p, ok, lesson.L.name==="Fouten oefenen");
    if(ex.p.key){ if(ex.review) reviewResult(ex.p, ok, lesson.lastScore ?? 1); else if(!ok) softLapse(ex.p); }
  }
  // wrong answers come back a few exercises later, until you get them right (max 3 times), like Duolingo
  if(!ok && !["dialog","branch","tip","hearIntro","build"].includes(ex.type) && !ex.requeued && (ex.reps||0)<3){
    ex.requeued=true;
    const again={type: ["intro","echo"].includes(ex.type)?"shadow":ex.type, p:ex.p, q:ex.q, model:ex.model, reps:(ex.reps||0)+1, old:ex.old, review:ex.review};
    lesson.queue.splice(Math.min(lesson.queue.length, lesson.i+4), 0, again);
    lesson.total++;
  }
  renderEx();
}
function next(){
  stopAudio();
  lesson.i++;
  Object.assign(lesson,{lastScore:null,failNote:"",melody:null,state:"ask",sel:null,heard:"",hint:false,autoplayed:false,fbTitle:null,fbNote:"",selfJudged:false});
  if(lesson.i>=lesson.queue.length) return finish();
  renderEx();
}
function finish(){
  const perfect = lesson.mistakes===0;
  const xp = lesson.L.review ? 5 + 2*lesson.correct : 10 + (perfect?5:0) + (lesson.L.dialog?5:0);
  if(lesson.L.phrases) lesson.L.phrases.forEach(introduce);
  if(lesson.L.daily) S.dailyDone=today();
  const wasGoal = S.daily.xp>=S.goal;
  ensureGarden(); const g0 = treeGrowth();
  addXP(xp);
  const g1 = treeGrowth();
  const decoBefore = unitsDone();
  if(lesson.id){
    const stars = perfect?3: lesson.mistakes<=2?2:1;
    S.done[lesson.id] = Math.max(S.done[lesson.id]||0, stars);
    S.lvl=S.lvl||{}; S.lvl[lesson.id]=Math.max(S.lvl[lesson.id]||0, lesson.level||1);
  }
  save();
  const hatched = ANIMAL_SETS[S.tree.set||0].find(a=>g0<a.hatch && g1>=a.hatch);
  const visitor = rollBonusVisitor(); save();
  const newDeco = unitsDone()>decoBefore && DECOS[decoBefore] ? DECOS[decoBefore] : null;
  lesson.result = {xp, perfect, goalNow: !wasGoal && S.daily.xp>=S.goal, g0, g1, hatched, newDeco, visitor};
  view="result"; render();
}
function renderResult(){
  const r=lesson.result;
  const acc = Math.round(lesson.correct/Math.max(1,lesson.correct+lesson.mistakes)*100);
  const grew = Math.max(0, Math.round((r.g1-r.g0)*1000)/10);
  const head = r.newDeco ? `Nieuw in je tuin: ${r.newDeco.emoji} ${r.newDeco.name}!` : r.g1>=1 && r.g0<1 ? "Volle bloei! 🌸" : r.hatched ? `Er is een ${r.hatched.name.split(" ")[0].toLowerCase()} bij gekomen! ${r.hatched.emoji}` : r.perfect ? "Foutloos! 完璧！" : "Les voltooid!";
  $app.innerHTML = `<div class="result pop" style="justify-content:flex-start">
    <div class="scene" style="margin:0;width:100%;max-width:420px" id="growscene">${sceneSVG(r.g0,S.tree,{petals:false})}</div>
    <h1>${head}</h1>
    <p id="growcap" style="margin:0;font-weight:800;min-height:1.4em;text-align:center"></p>
    <p style="color:var(--muted);margin:0;font-weight:700">Je boom groeide +${grew}% ${r.goalNow?"· dagdoel gehaald 💧":""}</p>
    ${r.visitor?`<p style="margin:0;font-weight:800">👀 Er is iemand op bezoek in je tuin${r.visitor.r>=3?" … iets bijzonders!":"!"} Tik hem aan op het startscherm.</p>`:""}
    <div class="stats">
      <div class="stat"><b>+${r.xp}</b><span>XP</span></div>
      <div class="stat"><b>${acc}%</b><span>Goed</span></div>
      <div class="stat"><b>${Math.round(r.g1*100)}%</b><span>Boom</span></div>
    </div>
    <button class="btn" style="flex:none;width:100%;max-width:360px" onclick="lesson=null;go('home')">Doorgaan</button>
  </div>`;
  runEvolution(r);
}
// Pokémon-style evolution: the tree flickers between old and new as a glowing silhouette, a flash, then the new tree with sparkles
function runEvolution(r){
  const wrap=document.getElementById("growscene"), cap=document.getElementById("growcap");
  const seed=S.tree.seed, diff=treeDiff(r.g0, r.g1, seed);
  const parts=[];
  if(diff.sprout) parts.push("een kiemplantje");
  if(diff.branches) parts.push(`${diff.branches} ${diff.branches===1?"nieuwe tak":"nieuwe takken"}`);
  if(diff.leaves) parts.push(`${diff.leaves} ${diff.leaves===1?"blaadje":"blaadjes"}`);
  if(diff.blossoms) parts.push(`${diff.blossoms} ${diff.blossoms===1?"bloesem":"bloesems"} 🌸`);
  if(r.hatched) parts.push(`een ${r.hatched.name.split(" ")[0].toLowerCase()} ${r.hatched.emoji}`);
  const what = parts.length ? "Er groeide: "+parts.join(" · ")+"!" : diff.longer ? "Je takken werden langer en dikker." : "";
  if(r.g1<=r.g0+.0005){ wrap.innerHTML=sceneSVG(r.g1,S.tree,{petals:true, highlight:r.newDeco?r.newDeco.id:null}); cap.textContent="Je boom heeft vandaag al genoeg water gehad 💧"; return; }
  wrap.innerHTML=sceneSVG(r.g0,S.tree,{petals:false, evolve:true});
  const layer=()=>document.getElementById("treeLayer");
  const setTree=g=>{ const l=layer(); if(l) l.innerHTML=treeSVG(g, seed, {}, {halo:false}); };
  cap.textContent="Je boom groeit…";
  let showNew=false, delay=420, alive=true;
  const stop=()=>{ alive=false; };
  wrap.onclick=()=>{ if(alive){ stop(); finishEvo(); } };     // tap to skip
  const tick=()=>{
    if(!alive || view!=="result" || !layer()) return;
    showNew=!showNew; setTree(showNew?r.g1:r.g0);
    delay=Math.max(55, delay*.8);
    if(delay>56) setTimeout(tick, delay); else setTimeout(()=>{ if(alive){ stop(); finishEvo(); } }, 120);
  };
  setTimeout(()=>{ if(!alive||!layer()) return; layer().classList.add("sil"); tick(); }, 500);
  function finishEvo(){
    if(view!=="result") return;
    const f=document.getElementById("flash"); if(f){ f.classList.add("flashing"); }
    setTimeout(()=>{
      if(view!=="result") return;
      wrap.innerHTML=sceneSVG(r.g1,S.tree,{petals:true, evolve:true, highlight: r.newDeco?r.newDeco.id : r.hatched?r.hatched.id:null});
      const sp=document.getElementById("sparkLayer"); if(sp) sp.innerHTML=sparkSVG(diff.spots);
      cap.textContent = what || "Je boom groeide een beetje.";
      chime(true);
    }, 260);
  }
}

/* ---------- settings ---------- */
function setS(k,v){ if(k==="goal") S.goal=v; else S.settings[k]=v; save(); render(); }
function seg(k,opts,cur){ return `<div class="seg">${opts.map(([v,l])=>`<button class="${cur===v?"on":""}" onclick='setS("${k}",${JSON.stringify(v)})'>${l}</button>`).join("")}</div>`; }
function renderSettings(){
  const s=S.settings;
  $app.innerHTML = `<div class="topbar"><button class="iconbtn" onclick="go('home')" aria-label="Terug">←</button><div class="brand">Instellingen</div></div>
  <div class="page">
    <div class="setting"><h3>Begeleider</h3><p>Wie oefent er met je mee?</p>
      <div class="seg">${Object.values(BUDDIES).map(b=>`<button class="${BUDDY.id===b.id?"on":""}" onclick="S.buddy='${b.id}';save();location.reload()">${b.id==="panda"?"🐼":"🐱"} ${b.name}</button>`).join("")}</div></div>
    <div class="setting"><h3>Je naam</h3><p>In de lessen zeg je: <span class="jp">私は${esc(ME.kata)}です</span> (${esc(ME.romaji)})</p>
      <button class="btn secondary" style="flex:none;padding:10px 16px;font-size:.95rem" onclick="startOnboarding(1)">Naam aanpassen</button></div>
    <div class="setting"><h3>Dagdoel</h3><p>Een les levert 10–20 XP op.</p>${seg("goal",[[10,"Rustig · 10"],[20,"Normaal · 20"],[30,"Serieus · 30"],[50,"Intens · 50"]],S.goal)}</div>
    <div class="setting"><h3>Spreeksnelheid</h3><p>Hoe snel de Japanse stem praat.</p>${seg("rate",[[0.7,"Langzaam"],[0.9,"Normaal"],[1.05,"Natuurlijk"]],s.rate)}
      <div style="margin-top:10px"><button class="play" onclick="speak('こんにちは、よろしくおねがいします')">🔊 Test de stem</button>
</div></div>
    <div class="setting"><h3>Stem</h3><p>${hasRecordings()?`Natuurlijke opgenomen stemmen (${Object.keys(AUDIO).length} zinnen), of de stem van je telefoon.`:"Nog geen opgenomen stemmen in deze versie; de app gebruikt de stem van je telefoon."}</p>
      ${seg("voice",[["natural","🎙️ Natuurlijk"],["phone","📱 Telefoonstem"]],s.voice||"natural")}</div>
    <div class="setting"><h3>Uitspraakhulp 🗣️</h3><p>Hoe je het als Nederlander uitspreekt, bijv. <b>iie → ieː·e</b>, <b>desu → des</b>. ie = fiets, oe = boek, e = bed, ː = lang aanhouden.</p>
      ${seg("phon",[["altijd","Altijd"],["nieuw","Bij nieuw en na een fout"],["uit","Uit"]],phonMode())}</div>
    <div class="setting"><h3>Tekst tonen</h3><p>Wil je meer op je gehoor leren? Zet de tekst uit.</p>
      ${seg("romaji",[[true,"Romaji aan"],[false,"Romaji uit"]],s.romaji)}<div style="height:8px"></div>
      ${seg("kana",[[true,"Japans schrift aan"],[false,"Japans schrift uit"]],s.kana)}</div>
    <div class="setting"><h3>Beoordeling van je uitspraak</h3><p>Laat de app meeluisteren, of beoordeel jezelf (handig als de herkenning je niet goed verstaat).</p>
      ${seg("mode",[["auto","🎙️ App luistert mee"],["self","🙋 Zelf beoordelen"]],s.mode)}
      <p style="margin-top:12px">Hoe streng: <b>Streng</b> = alleen de eerste gok van de spraakherkenning telt en hij moet voor 92% kloppen.</p>
      ${seg("strict",[["mild","Mild · 75%"],["normaal","Normaal · 85%"],["streng","Streng · 92%"]],s.strict||"streng")}</div>
    <div class="setting"><h3>App-versie</h3><p>Je hebt versie ${APP_BUILD?"1."+APP_BUILD:"(ontwikkelversie)"}.${upd?` Versie 1.${upd.build} staat klaar.`:""}</p>
      ${upd?`<button class="btn" style="flex:none;padding:10px 16px;font-size:.95rem" onclick="installUpdate()">Bijwerken naar 1.${upd.build}</button>`
           :`<button class="btn secondary" style="flex:none;padding:10px 16px;font-size:.95rem" onclick="checkUpdate(true)">Controleer op updates</button>`}</div>
    <div class="setting" style="border:2px dashed var(--peach)"><h3>🧪 Testen (tijdelijk)</h3><p>Laat je boom vooruit groeien om de diertjes en de tuin te bekijken. Boom ${S.tree?S.tree.n:1} staat op ${Math.round(treeGrowth()*100)}%.</p>
      <div class="seg"><button onclick="testGrow(.1)">+10%</button><button onclick="testGrow(.3)">+30%</button><button onclick="testGrow(1)">Volle bloei</button><button onclick="testReset()">Terug naar zaadje</button></div></div>
    <div class="setting"><h3>Thema</h3>${seg("theme",[["auto","Automatisch"],["light","Licht"],["dark","Donker"]],s.theme)}</div>
    <div class="setting"><h3>Voortgang</h3><p>${S.xp} XP · ${learnedPhrases().length} zinnen geleerd · ${Object.keys(S.done).length} lessen gedaan</p>
      <button class="btn coral" style="flex:none;padding:10px 16px;font-size:.95rem" onclick="if(confirm('Alle voortgang wissen?')){S=defaults();save();render();}">Alles wissen</button></div>
    <div style="display:flex;justify-content:center;margin-top:20px">${buddy("sleepy",80)}</div>
  </div>`;
}

if(window.Capacitor?.addListener){
  window.Capacitor.addListener("App","backButton",()=>{
    if(view==="listenmode"){ stopListenMode(); lm=null; go("home"); }
    else if(view==="lesson") quitLesson();
    else if(view==="melody") go("phrases");
    else if(view==="story"){ stopStory(); sto=null; go("learn"); }
    else if(view!=="home"){ lesson=null; go("home"); }
    else nat("App","exitApp").catch(()=>{});
  });
  window.Capacitor.addListener("App","resume",()=>{ applyInsets(); if(Date.now()-lastUpdCheck > 30*60e3) checkUpdate(); });
}
function applyInsets(){
  nat("Screen","insets").then(r=>document.documentElement.style.setProperty("--safe-top",(r&&r.top||0)+"px")).catch(()=>{});
}
applyInsets(); setTimeout(applyInsets, 800);
if(!S.onboarded) startOnboarding(); else render();
checkUpdate();
</script>
</body>
</html>
